global:
  # Registry prefix for every image this chart renders. Overrides the
  # registry of each image below. Parent charts can set it for all subcharts.
  imageRegistry: ""
  # Pull Secrets added to the cluster's imagePullSecrets, as names or {name: x}.
  # A name already in cluster.spec.imagePullSecrets is not added twice.
  imagePullSecrets: []

# Override the app.kubernetes.io/name label (defaults to the chart name)
nameOverride: ""
# ValkeyCluster metadata.name, also used for the other rendered objects.
# Defaults to the release name.
fullnameOverride: ""

# Labels added to all rendered resources
commonLabels: {}

# Free-form values for use inside templated strings (see cluster.spec tpl).
# Not rendered as a Kubernetes object by itself.
# Example:
#   extraValues:
#     tlsSecret: my-tls
#   cluster:
#     spec:
#       networking:
#         tls:
#           certificates:
#             server:
#               secretName: "{{ .Values.extraValues.tlsSecret }}"
extraValues: {}

# Scrape ValkeyNode metrics-exporter sidecars (port name "metrics", default 9121).
# Requires Prometheus Operator CRDs. Operator enables the exporter by default
# (cluster.spec.exporter.enabled); disable the exporter there if you do not want metrics.
metrics:
  podMonitor:
    enabled: false
    # Container port name on the metrics-exporter sidecar
    port: metrics
    # Namespace for the PodMonitor (defaults to release namespace)
    namespace: ""
    # Extra labels on the PodMonitor object (e.g. prometheus release selector)
    labels: {}
    annotations: {}
    interval: ""
    scrapeTimeout: ""
    honorLabels: false
    scheme: ""
    tlsConfig: {}
    relabelings: []
    metricRelabelings: []
    podTargetLabels: []
    sampleLimit: null
    targetLimit: null
    # Additional matchLabels merged into the pod selector (default selects
    # valkey.io/cluster=<ValkeyCluster name> in the release namespace)
    selector: {}

# ValkeyCluster resource. Nested so future CR kinds (e.g. standalone, sentinel)
# can sit beside this as valkey / sentinel without a generic top-level "spec".
# v0.1: one ValkeyCluster per release. Later kinds stay one logical workload
# per release (enable at most one primary CR kind, or document if that changes).
cluster:
  # Annotations on the ValkeyCluster object
  annotations: {}
  # Labels on the ValkeyCluster object (in addition to chart labels)
  labels: {}

  # Valkey server image. The defaults match the valkey-operator chart's
  # manager.defaultImages. The chart sets spec.image from this block so each
  # cluster upgrades Valkey on its own schedule, not when the operator does.
  # Renders [registry/]repository[:tag][@sha256:sha]. An empty registry keeps
  # the default string identical to the operator's, so pods do not roll.
  # cluster.spec.image overrides it.
  image:
    registry: ""
    repository: valkey/valkey
    tag: "9.0.0"
    # Digest to pin, with or without the sha256: prefix
    sha: ""
    # Pull policy: Always, IfNotPresent or Never. Empty leaves the operator's
    # default. Applied through the containers patch on the server container.
    pullPolicy: ""

  exporter:
    # Metrics exporter sidecar image. Same behaviour as cluster.image, and
    # cluster.spec.exporter.image overrides it.
    image:
      registry: ""
      repository: oliver006/redis_exporter
      tag: "v1.88.0"
      sha: ""
      # Pull policy: Always, IfNotPresent or Never. Empty leaves the operator's
      # default. Applied through the containers patch on the metrics-exporter
      # container. It has no effect while the exporter is disabled.
      pullPolicy: ""

  # ValkeyCluster.spec. Every field of the operator's ValkeyCluster API is
  # listed below, commented out, with its description. values.schema.json
  # follows the CRD and rejects unknown fields here; put fields this chart
  # does not know about in cluster.additionalSpec.
  # Tested against operator appVersion (v0.9.0): scheduling under spec.scheduling,
  # PDB as {mode: ...}, node.spread.shard|primaries|pods. See CHANGELOG.md.
  # String values are rendered via tpl, so free-form string fields may use Helm
  # templates. Helm validates values against the schema before tpl runs, so an
  # enum, integer or boolean field cannot hold a template: set it through
  # cluster.additionalSpecString instead. Example:
  #   networking.tls.certificates.server.secretName: "{{ .Release.Name }}-tls"
  # API: https://github.com/valkey-io/valkey-operator/blob/main/docs/valkeycluster.md
  spec:
    # Convention for the listing below: a commented-out field is "#", one space,
    # then the YAML line at the indentation it has once uncommented. To use a
    # field, remove "# " from its line and from the lines of its children.
    # Notes about nested fields start with a second "#" so that they stay
    # comments after uncommenting. Values shown are examples, with the
    # operator default named in the sentence above where there is one.

    # Number of shard groups. Each group has one primary and replicasPerShard
    # replicas. Minimum 1.
    shards: 3

    # Replicas in each shard, in addition to its primary. Minimum 0. The chart
    # sets 1 when neither this nor the deprecated replicas is set.
    # replicasPerShard: 1

    # Deprecated: use replicasPerShard, which has the same meaning. A spec
    # cannot set both. Removed in v1beta1.
    # replicas: 1

    # Valkey image, used as written. Overrides cluster.image and
    # global.imageRegistry.
    # image: valkey/valkey:9.0.0

    # Durable storage for each ValkeyNode. Requires workloadType StatefulSet.
    # It cannot be added or removed after the cluster is created.
    # persistence:
    #   # Requested PVC size. It can only grow.
    #   size: 1Gi
    #   # Storage class for the PVC. Immutable.
    #   storageClassName: standard
    #   # Retain (default) keeps the PVC when the ValkeyNode is deleted. Delete
    #   # removes it.
    #   reclaimPolicy: Retain

    # Resource requirements for the Valkey container in each pod. Passed
    # through to Kubernetes without validation.
    # Example:
    # resources:
    #   requests:
    #     cpu: 500m
    #     memory: 1Gi
    #   limits:
    #     memory: 1Gi

    # Additional Valkey configuration parameters, as a map of parameter name
    # to value. Passed through without validation.
    # Example:
    # config:
    #   maxmemory-policy: allkeys-lru

    # Metrics exporter sidecar options.
    # exporter:
    #   # Enable or disable the sidecar. Enabled when unset.
    #   enabled: true
    #   # Exporter image, used as written. Overrides cluster.exporter.image
    #   # and global.imageRegistry.
    #   image: oliver006/redis_exporter:v1.88.0
    #   # Additional command-line arguments for the exporter container.
    #   args:
    #     - --include-system-metrics
    #   # Resource requirements for the exporter container. Passed through
    #   # without validation.
    #   resources:
    #     requests:
    #       cpu: 50m
    #       memory: 64Mi
    #   # SecurityContext for the exporter container. Passed through without
    #   # validation.
    #   securityContext:
    #     readOnlyRootFilesystem: true

    # How clients and peers reach cluster nodes.
    # networking:
    #   # DNS suffix that kubelet publishes Service DNS under. Used for Hostname
    #   # announce names and the default TLS server name. Must match the
    #   # cluster. Defaults to cluster.local.
    #   clusterDomain: cluster.local
    #   # In-cluster endpoint announcement after CLUSTER SLOTS.
    #   discovery:
    #     # IP (default) or Hostname. Hostname announces per-pod DNS names under
    #     # the headless Service and requires workloadType StatefulSet.
    #     preferredEndpointType: IP
    #   # Opt in to one ClusterIP Service per node. Omit it to create none.
    #   # Each Service selects that one pod.
    #   perNodeServices: {}
    #   # TLS for the cluster.
    #   tls:
    #     # Hostname used for TLS verification when the operator connects to a
    #     # node by pod IP. Defaults to
    #     # valkey-<name>.<namespace>.svc.<clusterDomain>.
    #     serverName: valkey.example.svc.cluster.local
    #     # Certificate slots used by the cluster.
    #     certificates:
    #       # Node identity presented to clients and peers, and the trust root
    #       # for the cluster. The Secret must contain ca.crt, tls.crt and
    #       # tls.key.
    #       server:
    #         # Name of the Secret.
    #         secretName: "{{ .Release.Name }}-tls"
    #     # Client certificate authentication. Mode defaults to Optional and
    #     # certificateUser to Disabled.
    #     clientAuth:
    #       # Required enforces mTLS. Optional allows both authenticated and
    #       # unauthenticated clients. Disabled turns client certificate
    #       # processing off.
    #       mode: Optional
    #       # How Valkey maps a client certificate to an ACL user. CN uses the
    #       # Common Name (Valkey 9.0+). URI uses the first matching URI SAN
    #       # (Valkey 9.1+). Disabled (default) leaves the directive unset.
    #       certificateUser: Disabled
    #       # Extra trust roots for client certificates issued by a different CA
    #       # than the server certificate. The operator merges them with the
    #       # server ca.crt. Each entry names a Secret or a ConfigMap, not both.
    #       # A map is also accepted: the keys are labels that are dropped, and
    #       # the entries are listed in key order. The CRD's list form works too.
    #       ca:
    #         # Name of a Secret holding the roots.
    #         client:
    #           secretName: client-ca
    #           # Key holding the roots, as PEM certificates or a SPIFFE trust
    #           # bundle. Defaults to ca.crt.
    #           key: ca.crt
    #         # Name of a ConfigMap holding the roots, as SPIRE and trust-manager
    #         # publish bundles.
    #         spiffe:
    #           configMapName: spiffe-bundle

    # Valkey access control managed by the operator.
    # acl:
    #   # Users managed by the operator. A map keyed by user name is also
    #   # accepted, and the CRD's list form works too.
    #   users:
    #     alice:
    #       # Enabled (default) or Disabled. Whether the user can authenticate.
    #       state: Enabled
    #       # Raw ACL rules appended to anything generated from the fields below.
    #       permissions: "+@read"
    #       # How the user authenticates: Secret, Any or Disabled.
    #       password:
    #         type: Secret
    #         # Secret holding the passwords. Defaults to the Secret
    #         # <ValkeyCluster name>-users, with the username as the key.
    #         secret:
    #           # Name of the Secret.
    #           name: my-users
    #           # Keys in the Secret that hold passwords. Valkey supports
    #           # several per user, for rotation. Defaults to the username.
    #           keys:
    #             - alice
    #       # Command categories, commands and subcommands the user may or may
    #       # not run.
    #       commands:
    #         allow:
    #           - "@read"
    #         deny:
    #           - "@dangerous"
    #       # Key patterns the user may access.
    #       keys:
    #         # Read-only access. Maps to %R~pattern.
    #         readOnly:
    #           - "cache:*"
    #         # Read and write access. Maps to ~pattern.
    #         readWrite:
    #           - "app:*"
    #         # Write-only access. Maps to %W~pattern.
    #         writeOnly:
    #           - "events:*"
    #       # Pub/Sub channel restrictions.
    #       channels:
    #         # Channel patterns. Maps to &pattern.
    #         patterns:
    #           - "news:*"

    # Pod placement.
    # scheduling:
    #   # Affinity for the pods, as in a pod spec. Kubernetes ANDs nodeAffinity
    #   # with nodeSelector, so a node must satisfy both. Passed through without
    #   # validation.
    #   affinity:
    #     nodeAffinity:
    #       requiredDuringSchedulingIgnoredDuringExecution:
    #         nodeSelectorTerms:
    #           - matchExpressions:
    #               - key: workload
    #                 operator: In
    #                 values: [valkey]
    #   # Node selector for the pods. Passed through without validation.
    #   nodeSelector:
    #     disktype: ssd
    #   # Tolerations for the pods. Passed through without validation. A map
    #   # is also accepted: the keys are labels that are dropped, and the
    #   # entries are listed in key order. The CRD's list form works too.
    #   tolerations:
    #     dedicated:
    #       key: dedicated
    #       operator: Equal
    #       value: valkey
    #       effect: NoSchedule
    #   # Topology spread constraints for the pods. Passed through without
    #   # validation. A map is also accepted, as for tolerations, and the
    #   # CRD's list form works too.
    #   topologySpreadConstraints:
    #     rack:
    #       maxSkew: 1
    #       topologyKey: topology.example.com/rack
    #       whenUnsatisfiable: ScheduleAnyway
    #       labelSelector:
    #         matchLabels:
    #           valkey.io/cluster: my-valkey
    #   # Name of an existing PriorityClass applied to every pod, which
    #   # protects them from eviction under resource pressure.
    #   priorityClassName: high-priority
    #   # Constraints on the node axis (topologyKey kubernetes.io/hostname).
    #   # With this unset, every node spread is Disabled.
    #   node:
    #     # Distributes the pods across nodes.
    #     spread:
    #       # Keep the pods of one shard on distinct nodes, as pod
    #       # anti-affinity. Disabled when unset.
    #       shard:
    #         # Disabled, Preferred or Required.
    #         mode: Preferred
    #       # Balance each shard's first pod across nodes, as a topology spread
    #       # constraint. Disabled when unset.
    #       primaries:
    #         mode: Preferred
    #       # Balance all pods across nodes, as a topology spread constraint.
    #       # Disabled when unset. Rejected alongside a primaries spread of the
    #       # same strength, so this example uses Required.
    #       pods:
    #         mode: Required
    #   # Constraints on the zone axis (topologyKey topology.kubernetes.io/zone).
    #   # With this unset, every zone spread is Disabled.
    #   zone:
    #     # Distributes the pods across zones.
    #     spread:
    #       # Balance the pods of each shard across zones. Disabled when unset.
    #       shard:
    #         # Disabled, Preferred or Required.
    #         mode: Preferred
    #       # Balance each shard's first pod across zones. Disabled when unset.
    #       primaries:
    #         mode: Disabled
    #       # Balance all pods across zones. Disabled when unset. At most one of
    #       # shard, primaries and pods may use each of Preferred and Required.
    #       pods:
    #         mode: Required
    #     # Give every pod a fixed zone by round-robin over an ordered list.
    #     # Cannot be combined with a zone spread that is not Disabled, so remove
    #     # the spread block above to use it. The nodeSelector must not
    #     # set topology.kubernetes.io/zone. Unset means no pinning.
    #     pinning:
    #       # A pod's zone is zones[(shardIndex + nodeIndex) % len(zones)].
    #       # Entries must be unique. Immutable while set: remove pinning,
    #       # reconcile, then add it again to change the list.
    #       zones:
    #         - us-east-1a
    #         - us-east-1b
    #         - us-east-1c
    #   #
    #   # Scheduling recipes from the operator docs. Each one replaces the node
    #   # and zone blocks above. Zone pinning is the pinning block above.
    #   #
    #   # Keep a shard's primary and replica off the same node, as a soft rule.
    #   # The minimum for production availability.
    #   # node:
    #   #   spread:
    #   #     shard:
    #   #       mode: Preferred
    #   #
    #   # Balance each shard's pods across zones, as a soft rule.
    #   # zone:
    #   #   spread:
    #   #     shard:
    #   #       mode: Preferred
    #   #
    #   # Forbid a shard's pods from sharing a node and bias them across zones.
    #   # The node and zone axes are independent, so they combine.
    #   # node:
    #   #   spread:
    #   #     shard:
    #   #       mode: Required
    #   # zone:
    #   #   spread:
    #   #     shard:
    #   #       mode: Preferred

    # Labels and annotations added to every Valkey pod. They are not part of
    # the workload selector and can change at any time, which rolls the pods.
    # Keys under valkey.io/ and the operator's app.kubernetes.io/ keys are
    # reserved.
    # podMetadata:
    #   # Labels added to the pods. Passed through without validation.
    #   labels:
    #     team: platform
    #   # Annotations added to the pods. Passed through without validation.
    #   annotations:
    #     example.com/owner: platform

    # PodSecurityContext for each ValkeyNode pod. When set, it replaces the
    # operator default. Passed through without validation.
    # Example:
    # podSecurityContext:
    #   fsGroup: 1000
    #   runAsUser: 1000
    #   runAsGroup: 1000

    # The operator-managed PodDisruptionBudget. The operator applies the
    # Cluster mode when this is unset.
    # podDisruptionBudget:
    #   # Cluster (default) or Disabled.
    #   mode: Cluster

    # Name of the ServiceAccount for the pods. The namespace's default
    # ServiceAccount is used when unset. The top-level serviceAccount value can
    # set this instead.
    # serviceAccountName: valkey

    # Secrets in the same namespace used to pull any of the images (Valkey,
    # exporter and additional containers). Passed through without validation.
    # A map keyed by Secret name (values {}) is also accepted, and the CRD's
    # list form works too.
    # Example:
    # imagePullSecrets:
    #   regcred: {}

    # Additional containers, or overrides for existing ones, applied as a
    # strategic merge patch. The name server-init is reserved. Passed through
    # without validation. A map keyed by container name is also accepted, and
    # the CRD's list form works too. Inside a container, env also takes a map
    # keyed by variable name (a scalar value becomes {name, value}). Quote a
    # value whose exact string matters: YAML reads an unquoted yes as true
    # and 0755 as 493. Map entries are sorted by name, and a $(VAR) reference
    # only expands variables listed before it, so use the list form for env
    # that needs one.
    # Example:
    # containers:
    #   sidecar:
    #     image: busybox
    #     command: ["sleep", "infinity"]
    #     env:
    #       LOG_LEVEL: debug

    # Pod termination grace period for the Valkey nodes, in seconds. Minimum 1.
    # It must give the graceful CLUSTER FAILOVER on SIGTERM time to hand each
    # shard to a replica before SIGKILL. When unset, the operator derives a
    # default from cluster-manual-failover-timeout. A lower value is honoured
    # but reported as a warning.
    # terminationGracePeriodSeconds: 60

    # StatefulSet (default) or Deployment. What each ValkeyNode creates.
    # Immutable.
    # workloadType: StatefulSet

    # Deprecated: use acl.users. It cannot be combined with acl.users and is
    # removed in v1beta1. Items take the acl.users fields name, permissions,
    # commands, keys and channels. In place of state and password they take
    # enabled, nopass, resetpass and passwordSecret. Only the top-level key is
    # listed here.
    # users: []

  # ValkeyCluster.spec fields not covered by cluster.spec (passed through tpl).
  # Deep-merged over cluster.spec; wins on conflict.
  additionalSpec: {}
  # Same, as a raw string rendered through tpl and parsed as YAML, for
  # templating that has to produce structure.
  additionalSpecString: ""

# NetworkPolicy for the Valkey pods (selected by valkey.io/cluster=<ValkeyCluster name>).
# Off by default. When enabled, ingress is limited to what the cluster needs to
# run, plus extraIngress:
#   - the cluster's own pods on the client (6379) and cluster-bus (16379) ports
#   - the operator on the client port
# Clients, metrics scrapers and anything else go in extraIngress, or set
# allowExternal to admit clients from any source. Egress is open unless
# allowExternalEgress is false.
# More info: https://kubernetes.io/docs/concepts/services-networking/network-policies/
networkPolicy:
  enabled: false
  # Peer allowed to reach the client port for reconciliation (a NetworkPolicyPeer).
  # Set it to null to drop the rule; {} does not, because Helm merges it into
  # this default. To replace the peer, set the default's namespaceSelector or
  # podSelector key to null alongside your own.
  operator:
    namespaceSelector: {}
    podSelector:
      matchLabels:
        app.kubernetes.io/name: valkey-operator
  # With metrics.podMonitor.enabled, the exporter port is also admitted from any
  # source so Prometheus can scrape it.
  # Admit clients on the client port from any source. When false, only the
  # cluster's own pods, the operator and extraIngress are admitted.
  allowExternal: false
  # Allow all egress. When false, egress is limited to the cluster's own pods
  # (client, cluster-bus) and DNS in dnsNamespace, plus extraEgress.
  allowExternalEgress: true
  # Namespace running kube-dns / CoreDNS, used when allowExternalEgress is false.
  # With NodeLocal DNSCache, also admit the node-local address (commonly
  # 169.254.20.10) through extraEgress; see README.
  dnsNamespace: kube-system
  # Additional ingress rules appended verbatim to the policy (templated with tpl)
  extraIngress: []
  # Example (allow an application namespace on the client port):
  #   extraIngress:
  #     - from:
  #         - namespaceSelector:
  #             matchLabels:
  #               kubernetes.io/metadata.name: my-app
  #       ports:
  #         - protocol: TCP
  #           port: client
  # Additional egress rules appended verbatim to the policy (templated with tpl)
  extraEgress: []
  # Extra labels to add to the NetworkPolicy
  labels: {}
  # Extra annotations to add to the NetworkPolicy
  annotations: {}
# ServiceAccount for the Valkey pods (operator v0.8.0+ spec.serviceAccountName).
# When create is true or name is set, and cluster.spec has no serviceAccountName,
# the chart sets spec.serviceAccountName. An explicit cluster.spec value always wins;
# with create: true it must match the chart's ServiceAccount name or the render fails.
# A named ServiceAccount that this chart does not create must already exist.
serviceAccount:
  create: false
  # Defaults to the chart fullname. May use templates.
  name: ""
  # Annotations to add to the service account
  annotations: {}
  # Labels to add to the service account
  labels: {}
  # Whether to automount the service account token
  automount: false
# Secret holding ACL user passwords, in the form the operator reads by default.
# The operator looks for Secret "<ValkeyCluster name>-users" unless
# a user names another Secret; the data key defaults to the
# username. To use a Secret you manage yourself, leave create: false and set
# cluster.spec.acl.users[].password.secret.name (see examples/users-acl.yaml).
# The chart only points users at this Secret, and checks passwords against it,
# for the deprecated cluster.spec.users.
usersSecret:
  create: false
  # Defaults to "<fullname>-users" and may use templates. When set, users in
  # cluster.spec.users without passwordSecret.name are pointed at this Secret.
  name: ""
  annotations: {}
  # username -> password. Each key becomes a Secret data key. Values must be
  # strings: quote anything YAML would read as a number or boolean. Every user
  # in cluster.spec.users that reads this Secret must have an entry (or one per
  # passwordSecret.keys entry); the render fails otherwise. Keep real passwords
  # out of committed values files.
  passwords: {}

# Extra Kubernetes objects rendered with the release (for example a ConfigMap
# or Secret the ValkeyCluster references). A map, so each key can be overridden
# per environment; set a key to null to drop an inherited entry. Each value is
# either an object or a multi-line string, and is rendered through tpl, so it
# may use Helm templates. No namespace is injected: set metadata.namespace if
# the object must not use the release namespace. Entries render in key order.
# Object entries are converted to YAML before tpl runs, so a value substituted
# inside quotes must not contain that quote character; for such values use the
# string form and `| quote` (see README).
# Example:
#   extraObjects:
#     settings:
#       apiVersion: v1
#       kind: ConfigMap
#       metadata:
#         name: '{{ include "valkey-resources.fullname" . }}-settings'
#       data:
#         release: '{{ .Release.Name }}'
extraObjects: {}
