# Override the default name of resources
nameOverride: ""
# Override the full name of resources (ValkeyCluster metadata.name)
fullnameOverride: ""

# Labels added to all rendered resources
commonLabels: {}

# Free-form values for use inside templated strings (see cluster.spec tpl).
# Not rendered as a Kubernetes object by itself.
# Example:
#   extraValues:
#     tlsSecret: my-tls
#   cluster:
#     spec:
#       networking:
#         tls:
#           certificates:
#             server:
#               secretName: "{{ .Values.extraValues.tlsSecret }}"
extraValues: {}

# Scrape ValkeyNode metrics-exporter sidecars (port name "metrics", default 9121).
# Requires Prometheus Operator CRDs. Operator enables the exporter by default
# (cluster.spec.exporter.enabled); disable the exporter there if you do not want metrics.
metrics:
  podMonitor:
    enabled: false
    # Container port name on the metrics-exporter sidecar
    port: metrics
    # Namespace for the PodMonitor (defaults to release namespace)
    namespace: ""
    # Extra labels on the PodMonitor object (e.g. prometheus release selector)
    labels: {}
    annotations: {}
    interval: ""
    scrapeTimeout: ""
    honorLabels: false
    scheme: ""
    tlsConfig: {}
    relabelings: []
    metricRelabelings: []
    podTargetLabels: []
    sampleLimit: null
    targetLimit: null
    # Additional matchLabels merged into the pod selector (default selects
    # valkey.io/cluster=<ValkeyCluster name> in the release namespace)
    selector: {}

# ValkeyCluster resource. Nested so future CR kinds (e.g. standalone, sentinel)
# can sit beside this as valkey / sentinel without a generic top-level "spec".
# v0.1: one ValkeyCluster per release. Later kinds stay one logical workload
# per release (enable at most one primary CR kind, or document if that changes).
cluster:
  # Annotations on the ValkeyCluster object
  annotations: {}
  # Labels on the ValkeyCluster object (in addition to chart labels)
  labels: {}

  # ValkeyCluster.spec drop-in (any CRD field allowed). Tested against operator
  # appVersion (v0.8.0): scheduling under spec.scheduling, PDB as {mode: ...},
  # node.spread.shard|primaries|pods. See CHANGELOG.md.
  # Rendered via tpl so string values may use Helm templates, e.g.
  #   image: "valkey/valkey:{{ .Chart.AppVersion }}"
  #   networking.tls.certificates.server.secretName: "{{ .Release.Name }}-tls"
  # API: https://github.com/valkey-io/valkey-operator/blob/main/docs/valkeycluster.md
  spec:
    shards: 3
    replicas: 1

# NetworkPolicy for the Valkey pods (selected by valkey.io/cluster=<ValkeyCluster name>).
# Off by default. When enabled the policy always admits the cluster's own pods
# (client, cluster-bus) and the operator (client), so the cluster can form and
# reconcile. Rules use the operator's named container ports: client (6379) and
# cluster-bus (16379).
# More info: https://kubernetes.io/docs/concepts/services-networking/network-policies/
networkPolicy:
  enabled: false
  # Peer allowed to reach the client port for reconciliation (a NetworkPolicyPeer). The
  # rule is dropped when this is null or empty. Helm merges overrides into this
  # default, so to replace the peer set its namespaceSelector or podSelector
  # key to null.
  operator:
    namespaceSelector: {}
    podSelector:
      matchLabels:
        app.kubernetes.io/name: valkey-operator
  # name -> NetworkPolicyPeer allowed to reach the client port. Entries render
  # in key order; set a key to null to drop an inherited entry.
  clients: {}
  # Additional ingress rules appended verbatim to the policy (templated with tpl)
  extraIngress: []
  # Example (allow Prometheus to scrape the exporter):
  #   extraIngress:
  #     - from:
  #         - namespaceSelector:
  #             matchLabels:
  #               kubernetes.io/metadata.name: monitoring
  #       ports:
  #         - protocol: TCP
  #           port: metrics
  egress:
    # Adds Egress to policyTypes. Once set, only the cluster's own pods, DNS
    # and extraEgress are allowed out.
    enabled: false
    # Allow UDP/TCP 53 to the dnsNamespace
    allowDNS: true
  # Namespace running kube-dns / CoreDNS
  dnsNamespace: kube-system
  # Additional egress rules appended verbatim to the policy while egress.enabled
  # is true (templated with tpl)
  extraEgress: []
  # Extra labels to add to the NetworkPolicy
  labels: {}
  # Extra annotations to add to the NetworkPolicy
  annotations: {}
