# ACL users with the Secret rendered by the chart. The operator reads passwords
# from "<ValkeyCluster name>-users" by default, with the username as the data
# key, so the users below need no passwordSecret reference.
#
# Passwords here are placeholders. Supply real ones at install time, e.g.
#   --set-string usersSecret.passwords.alice="$ALICE_PASSWORD"
# Usernames must not start with _ (reserved for operator system users).
usersSecret:
  create: true
  passwords:
    alice: change-me

cluster:
  spec:
    shards: 3
    replicas: 1
    users:
      - name: alice
        commands:
          allow: ["@read", "@write", "@connection"]
          deny: ["@admin", "@dangerous"]
        keys:
          readWrite: ["app:*"]
