{{- if .Values.usersSecret.create }}
{{- if not .Values.usersSecret.passwords }}
{{- fail "usersSecret.passwords must not be empty when usersSecret.create is true" }}
{{- end }}
{{- $secretName := include "valkey-resources.usersSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey-resources.labels" . | nindent 4 }}
    app.kubernetes.io/component: users
  {{- with .Values.usersSecret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $user, $password := .Values.usersSecret.passwords }}
  {{- if or (kindIs "invalid" $password) (eq (toString $password) "") }}
    {{- if $.Values.usersSecret.generate }}
      {{- $lookedupPassword := "" }}
      {{- $lookupSecretData := (lookup "v1" "Secret" $.Release.Namespace $secretName).data }}
      {{- if hasKey $lookupSecretData $user }}
        {{- $lookedupPassword = index $lookupSecretData $user | b64dec }}
      {{- end }}
      {{- $password = default (randAlphaNum 32) $lookedupPassword }}
    {{- else }}
      {{- fail (printf "usersSecret.passwords.%s must not be empty" $user) }}
    {{- end }}
  {{- end }}
  {{ $user | quote }}: {{ $password | b64enc | quote }}
  {{- end }}
{{- end }}
