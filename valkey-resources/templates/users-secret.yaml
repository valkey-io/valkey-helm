{{- if .Values.usersSecret.create }}
{{- if not .Values.usersSecret.passwords }}
{{- fail "usersSecret.passwords must not be empty when usersSecret.create is true" }}
{{- end }}
{{- $secretName := include "valkey-resources.usersSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey-resources.labels" . | nindent 4 }}
    app.kubernetes.io/component: users
  {{- with .Values.usersSecret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{- range $user, $password := .Values.usersSecret.passwords }}
  {{- $renderedPassword := tpl $password (merge (dict "user" $user "secretName" $secretName) $) }}
  {{- if or (kindIs "invalid" $renderedPassword) (eq (toString $renderedPassword) "") }}
  {{- fail (printf "usersSecret.passwords.%s must not be empty" $user) }}
  {{- end }}
  {{ $user | quote }}: {{ $renderedPassword | b64enc | quote }}
  {{- end }}
{{- end }}
