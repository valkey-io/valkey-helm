apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: {{ include "valkey-resources.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey-resources.labels" . | nindent 4 }}
    {{- with .Values.cluster.labels }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
  {{- with .Values.cluster.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
{{- $spec := deepCopy .Values.cluster.spec }}
{{- $ctx := dict "spec" $spec "root" . }}
{{- /* Order matters: see templates/_valkeycluster.tpl */}}
{{- include "valkey-resources.spec.additional" $ctx }}
{{- include "valkey-resources.spec.mapsToLists" $ctx }}
{{- include "valkey-resources.spec.images" $ctx }}
{{- include "valkey-resources.spec.pullSecrets" $ctx }}
{{- include "valkey-resources.spec.pullPolicies" $ctx }}
{{- include "valkey-resources.spec.replicas" $ctx }}
{{- include "valkey-resources.spec.serviceAccount" $ctx }}
{{- include "valkey-resources.spec.usersSecret" $ctx }}
spec:
  {{- tpl (toYaml $spec) . | nindent 2 }}
