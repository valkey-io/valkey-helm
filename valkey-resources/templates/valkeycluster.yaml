apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: {{ include "valkey-resources.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "valkey-resources.labels" . | nindent 4 }}
    {{- with .Values.cluster.labels }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
  {{- with .Values.cluster.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
{{- $spec := deepCopy .Values.cluster.spec }}
{{- if .Values.usersSecret.create }}
{{- $secretName := include "valkey-resources.usersSecretName" . }}
{{- $users := list }}
{{- range $user := ($spec.users | default list) }}
{{- $user = deepCopy $user }}
{{- if not $user.nopass }}
{{- $ref := deepCopy (default dict $user.passwordSecret) }}
{{- $refName := tpl (toString (default "" $ref.name)) $ }}
{{- if or (eq $refName "") (eq $refName $secretName) }}
{{- if and $.Values.usersSecret.name (eq $refName "") }}
{{- $_ := set $ref "name" $secretName }}
{{- $_ := set $user "passwordSecret" $ref }}
{{- end }}
{{- $userName := tpl (toString $user.name) $ }}
{{- range $key := (default (list $userName) $ref.keys) }}
{{- $key = tpl (toString $key) $ }}
{{- if not (hasKey $.Values.usersSecret.passwords $key) }}
{{- fail (printf "cluster.spec.users %q reads password key %q, but usersSecret.passwords has no entry for it" $userName $key) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $users = append $users $user }}
{{- end }}
{{- if $spec.users }}
{{- $_ := set $spec "users" $users }}
{{- end }}
{{- end }}
spec:
  {{- tpl (toYaml $spec) . | nindent 2 }}
