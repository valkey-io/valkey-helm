{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "valkey-resources.serviceAccountName" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- mustMergeOverwrite (include "valkey-resources.labels" . | fromYaml) (.Values.serviceAccount.labels | default dict) | toYaml | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
