suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders with fullname
    set:
      fullnameOverride: mt
      serviceAccount:
        create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: mt
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: honours name and annotations
    set:
      serviceAccount:
        create: true
        name: custom-sa
        annotations:
          example.com/role: reader
        automountServiceAccountToken: true
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa
      - equal:
          path: metadata.annotations["example.com/role"]
          value: reader
      - equal:
          path: automountServiceAccountToken
          value: true
