suite: serviceaccount
templates:
  - templates/serviceaccount.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders with fullname
    set:
      fullnameOverride: mt
      serviceAccount:
        create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: mt
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: honours name, annotations and automount
    set:
      serviceAccount:
        create: true
        name: custom-sa
        annotations:
          example.com/role: reader
        automount: true
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa
      - equal:
          path: metadata.annotations["example.com/role"]
          value: reader
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: merges extra labels over the chart labels
    set:
      serviceAccount:
        create: true
        labels:
          team: data
          app.kubernetes.io/name: custom
    asserts:
      - equal:
          path: metadata.labels.team
          value: data
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: custom
