suite: users secret
templates:
  - templates/users-secret.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the operator default name
    set:
      fullnameOverride: mt
      usersSecret.create: true
      usersSecret.passwords:
        default: s3cret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: mt-users
      - equal:
          path: type
          value: Opaque
      - equal:
          path: data.default
          value: czNjcmV0

  - it: honours usersSecret.name
    set:
      usersSecret.create: true
      usersSecret.name: custom
      usersSecret.passwords:
        default: s3cret
    asserts:
      - equal:
          path: metadata.name
          value: custom

  - it: rejects a leading-zero number as a password
    set:
      usersSecret.create: true
      usersSecret.passwords:
        a: 0123
    asserts:
      - failedTemplate:
          errorPattern: "usersSecret/passwords/a.*want string"

  - it: rejects a decimal as a password
    set:
      usersSecret.create: true
      usersSecret.passwords:
        a: 1.10
    asserts:
      - failedTemplate:
          errorPattern: "usersSecret/passwords/a.*want string"

  - it: rejects a long number as a password
    set:
      usersSecret.create: true
      usersSecret.passwords:
        a: 12345678901234567890
    asserts:
      - failedTemplate:
          errorPattern: "usersSecret/passwords/a.*want string"

  - it: rejects an integer as a password
    set:
      usersSecret.create: true
      usersSecret.passwords:
        a: 12345
    asserts:
      - failedTemplate:
          errorPattern: "usersSecret/passwords/a.*want string"

  - it: rejects a boolean as a password
    set:
      usersSecret.create: true
      usersSecret.passwords:
        a: true
    asserts:
      - failedTemplate:
          errorPattern: "usersSecret/passwords/a.*want string"

  - it: stores quoted numeric-looking passwords exactly
    set:
      usersSecret.create: true
      usersSecret.passwords:
        a: "0123"
        b: "1.10"
        c: "12345678901234567890"
        d: "on"
    asserts:
      - equal:
          path: data.a
          value: MDEyMw==
      - equal:
          path: data.b
          value: MS4xMA==
      - equal:
          path: data.c
          value: MTIzNDU2Nzg5MDEyMzQ1Njc4OTA=
      - equal:
          path: data.d
          value: b24=

  - it: renders a templated usersSecret.name
    release:
      name: rel
    set:
      usersSecret.create: true
      usersSecret.name: "{{ .Release.Name }}-pw"
      usersSecret.passwords:
        alice: pw
    asserts:
      - equal:
          path: metadata.name
          value: rel-pw

  - it: fails on empty passwords
    set:
      usersSecret.create: true
      usersSecret.passwords: {}
    asserts:
      - failedTemplate:
          errorMessage: "usersSecret.passwords must not be empty when usersSecret.create is true"

  - it: fails on an empty password
    set:
      usersSecret.create: true
      usersSecret.passwords:
        default: ""
    asserts:
      - failedTemplate:
          errorMessage: "usersSecret.passwords.default must not be empty"

  - it: carries common labels and annotations
    set:
      commonLabels:
        team: x
      usersSecret.create: true
      usersSecret.annotations:
        a: b
      usersSecret.passwords:
        default: s3cret
    asserts:
      - equal:
          path: metadata.labels.team
          value: x
      - equal:
          path: metadata.annotations.a
          value: b

  - it: keeps the full default name for a long fullnameOverride
    set:
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      usersSecret.create: true
      usersSecret.passwords:
        default: s3cret
    asserts:
      - equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-users

  - it: keeps a numeric-looking name a string
    set:
      usersSecret:
        create: true
        name: "123"
        passwords:
          alice: pw
    asserts:
      - equal:
          path: metadata.name
          value: "123"
