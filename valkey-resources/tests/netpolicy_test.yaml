suite: networkpolicy
templates:
  - templates/netpolicy.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: allows only the cluster, the operator and DNS when enabled
    set:
      fullnameOverride: mt
      networkPolicy.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: NetworkPolicy
      - equal:
          path: metadata.name
          value: mt
      - equal:
          path: spec.podSelector.matchLabels["valkey.io/cluster"]
          value: mt
      - equal:
          path: spec.policyTypes
          value: [Ingress, Egress]
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector:
                    matchLabels:
                      valkey.io/cluster: mt
              ports:
                - port: client
                  protocol: TCP
                - port: cluster-bus
                  protocol: TCP
            - from:
                - namespaceSelector: {}
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: valkey-operator
              ports:
                - port: client
                  protocol: TCP
      - equal:
          path: spec.egress
          value:
            - to:
                - podSelector:
                    matchLabels:
                      valkey.io/cluster: mt
              ports:
                - port: client
                  protocol: TCP
                - port: cluster-bus
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
              ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP

  - it: drops the operator rule when operator is null
    set:
      networkPolicy:
        enabled: true
        operator: null
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1

  - it: drops the operator rule when both default selectors are nulled
    set:
      networkPolicy:
        enabled: true
        operator:
          namespaceSelector: null
          podSelector: null
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 1

  - it: renders a custom operator peer as given
    set:
      networkPolicy:
        enabled: true
        operator:
          namespaceSelector:
            matchLabels:
              team: ops
          podSelector: null
    asserts:
      - equal:
          path: spec.ingress[1].from
          value:
            - namespaceSelector:
                matchLabels:
                  team: ops

  - it: quotes the cluster label value
    set:
      fullnameOverride: "123"
      networkPolicy:
        enabled: true
    asserts:
      - equal:
          path: spec.podSelector.matchLabels["valkey.io/cluster"]
          value: "123"

  - it: sends DNS to dnsNamespace
    set:
      networkPolicy:
        enabled: true
        dnsNamespace: dns
    asserts:
      - equal:
          path: spec.egress[1].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: dns

  - it: appends extra ingress rules in order
    set:
      networkPolicy:
        enabled: true
        extraIngress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    app: monitoring
            ports:
              - port: metrics
                protocol: TCP
          - from:
              - ipBlock:
                  cidr: 10.0.0.0/8
    asserts:
      - lengthEqual:
          path: spec.ingress
          count: 4
      - equal:
          path: spec.ingress[2].ports[0].port
          value: metrics
      - equal:
          path: spec.ingress[3].from[0].ipBlock.cidr
          value: 10.0.0.0/8

  - it: appends extra egress rules in order
    set:
      networkPolicy:
        enabled: true
        extraEgress:
          - to:
              - ipBlock:
                  cidr: 192.168.0.0/16
            ports:
              - port: 443
    asserts:
      - lengthEqual:
          path: spec.egress
          count: 3
      - equal:
          path: spec.egress[2].to[0].ipBlock.cidr
          value: 192.168.0.0/16

  - it: templates extra ingress and egress rules with tpl
    set:
      networkPolicy:
        enabled: true
        extraIngress:
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: "{{ .Release.Namespace }}"
        extraEgress:
          - to:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: "{{ .Release.Name }}-backup"
    release:
      name: rel
      namespace: ns1
    asserts:
      - equal:
          path: spec.ingress[2].from[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: ns1
      - equal:
          path: spec.egress[2].to[0].namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: rel-backup

  - it: labels the policy as a networkpolicy component by default
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: networkpolicy
      - notExists:
          path: metadata.annotations

  - it: merges policy labels and sets annotations
    set:
      networkPolicy:
        enabled: true
        labels:
          team: data
          app.kubernetes.io/component: custom
        annotations:
          example.com/owner: data
    asserts:
      - equal:
          path: metadata.labels.team
          value: data
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: custom
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: data
