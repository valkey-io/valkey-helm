suite: valkeycluster resource
templates:
  - templates/valkeycluster.yaml
tests:
  - it: renders ValkeyCluster with defaults
    asserts:
      - isKind:
          of: ValkeyCluster
      - equal:
          path: apiVersion
          value: valkey.io/v1alpha1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-valkey-resources
      - equal:
          path: spec.shards
          value: 3
      - equal:
          path: spec.replicas
          value: 1

  - it: uses fullnameOverride
    set:
      fullnameOverride: my-cluster
    asserts:
      - equal:
          path: metadata.name
          value: my-cluster

  - it: drops in arbitrary ValkeyClusterSpec fields via cluster.spec
    set:
      cluster:
        spec:
          shards: 5
          replicas: 2
          image: valkey/valkey:9.0.0
          config:
            maxmemory: 50mb
          scheduling:
            priorityClassName: high-priority
            nodeSelector:
              disk: ssd
          persistence:
            size: 10Gi
            reclaimPolicy: Retain
          networking:
            tls:
              certificates:
                server:
                  secretName: valkey-tls
          exporter:
            enabled: false
    asserts:
      - equal:
          path: spec.shards
          value: 5
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.image
          value: valkey/valkey:9.0.0
      - equal:
          path: spec.config.maxmemory
          value: 50mb
      - equal:
          path: spec.scheduling.priorityClassName
          value: high-priority
      - equal:
          path: spec.scheduling.nodeSelector.disk
          value: ssd
      - equal:
          path: spec.persistence.size
          value: 10Gi
      - equal:
          path: spec.networking.tls.certificates.server.secretName
          value: valkey-tls
      - equal:
          path: spec.exporter.enabled
          value: false

  - it: applies metadata labels and annotations under cluster
    set:
      cluster:
        annotations:
          example.com/owner: team-a
        labels:
          env: test
        spec:
          shards: 3
          replicas: 1
      commonLabels:
        team: platform
    asserts:
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: team-a
      - equal:
          path: metadata.labels.env
          value: test
      - equal:
          path: metadata.labels.team
          value: platform

  - it: templates cluster.spec strings with tpl
    set:
      cluster:
        spec:
          shards: 3
          replicas: 1
          image: "valkey/valkey:{{ .Chart.AppVersion }}"
          networking:
            tls:
              certificates:
                server:
                  secretName: "{{ .Release.Name }}-tls"
    asserts:
      - equal:
          path: spec.image
          value: valkey/valkey:v0.8.0
      - equal:
          path: spec.networking.tls.certificates.server.secretName
          value: RELEASE-NAME-tls

  - it: templates using extraValues
    set:
      extraValues:
        tlsSecret: shared-valkey-tls
      cluster:
        annotations:
          note: "tls={{ .Values.extraValues.tlsSecret }}"
        spec:
          shards: 3
          replicas: 0
          networking:
            tls:
              certificates:
                server:
                  secretName: "{{ .Values.extraValues.tlsSecret }}"
    asserts:
      - equal:
          path: metadata.annotations.note
          value: tls=shared-valkey-tls
      - equal:
          path: spec.networking.tls.certificates.server.secretName
          value: shared-valkey-tls

  - it: does not set serviceAccountName by default
    asserts:
      - notExists:
          path: spec.serviceAccountName

  - it: wires the created ServiceAccount
    set:
      fullnameOverride: mt
      serviceAccount:
        create: true
    asserts:
      - equal:
          path: spec.serviceAccountName
          value: mt

  - it: wires a named existing ServiceAccount
    set:
      serviceAccount:
        create: false
        name: existing
    asserts:
      - equal:
          path: spec.serviceAccountName
          value: existing

  - it: keeps an explicit cluster.spec.serviceAccountName
    set:
      serviceAccount:
        name: mine
      cluster:
        spec:
          shards: 3
          serviceAccountName: other
    asserts:
      - equal:
          path: spec.serviceAccountName
          value: other

  - it: fails when a created ServiceAccount would go unused
    set:
      fullnameOverride: mt
      serviceAccount:
        create: true
      cluster.spec.serviceAccountName: other
    asserts:
      - failedTemplate:
          errorMessage: 'cluster.spec.serviceAccountName is "other", so the ServiceAccount "mt" that serviceAccount.create renders would go unused: remove one of them, or set serviceAccount.name to match'

  - it: accepts an explicit serviceAccountName that names the created ServiceAccount
    set:
      serviceAccount:
        create: true
        name: shared
      cluster.spec.serviceAccountName: '{{ "shared" }}'
    asserts:
      - equal:
          path: spec.serviceAccountName
          value: shared
  - it: fails when a user has no password
    set:
      usersSecret:
        create: true
        passwords:
          alice: pw
      cluster.spec.users:
        - name: alice
        - name: bob
    asserts:
      - failedTemplate:
          errorMessage: 'cluster.spec.users "bob" reads password key "bob", but usersSecret.passwords has no entry for it'

  - it: checks every key a user lists
    set:
      usersSecret:
        create: true
        passwords:
          alice: pw
      cluster.spec.users:
        - name: alice
          passwordSecret:
            keys: [alice, alice-next]
    asserts:
      - failedTemplate:
          errorMessage: 'cluster.spec.users "alice" reads password key "alice-next", but usersSecret.passwords has no entry for it'

  - it: skips nopass, resetpass and disabled users, and users of another Secret
    set:
      usersSecret:
        create: true
        passwords:
          alice: pw
      cluster.spec.users:
        - name: alice
        - name: guest
          nopass: true
        - name: rotating
          resetpass: true
        - name: parked
          enabled: false
        - name: ops
          passwordSecret:
            name: ops-passwords
    asserts:
      - lengthEqual:
          path: spec.users
          count: 5
      - notExists:
          path: spec.users[1].passwordSecret
      - equal:
          path: spec.users[4].passwordSecret.name
          value: ops-passwords

  - it: does not check users when the chart does not create the Secret
    set:
      cluster.spec.users:
        - name: bob
    asserts:
      - equal:
          path: spec.users[0].name
          value: bob

  - it: points users at a renamed Secret
    set:
      usersSecret:
        create: true
        name: app-passwords
        passwords:
          alice: pw
          bob: pw2
      cluster.spec.users:
        - name: alice
        - name: bob
          passwordSecret:
            keys: [bob]
    asserts:
      - equal:
          path: spec.users[0].passwordSecret
          value:
            name: app-passwords
      - equal:
          path: spec.users[1].passwordSecret
          value:
            name: app-passwords
            keys: [bob]

  - it: leaves passwordSecret unset when the Secret keeps the default name
    set:
      usersSecret:
        create: true
        passwords:
          alice: pw
      cluster.spec.users:
        - name: alice
    asserts:
      - notExists:
          path: spec.users[0].passwordSecret

  - it: keeps an explicit passwordSecret.name that matches the chart Secret
    set:
      fullnameOverride: mt
      usersSecret:
        create: true
        passwords:
          alice: pw
      cluster.spec.users:
        - name: alice
          passwordSecret:
            name: '{{ include "valkey-resources.fullname" . }}-users'
    asserts:
      - equal:
          path: spec.users[0].passwordSecret.name
          value: mt-users

  - it: checks templated user names and keys after rendering them
    set:
      extraValues:
        user: alice
        key: alice-next
      usersSecret:
        create: true
        passwords:
          alice: pw
          alice-next: pw2
      cluster.spec.users:
        - name: '{{ .Values.extraValues.user }}'
        - name: '{{ .Values.extraValues.user }}'
          passwordSecret:
            keys: ['{{ .Values.extraValues.key }}']
    asserts:
      - equal:
          path: spec.users[0].name
          value: alice
      - equal:
          path: spec.users[1].passwordSecret.keys[0]
          value: alice-next

  - it: names the rendered user in the error
    set:
      extraValues:
        user: bob
      usersSecret:
        create: true
        passwords:
          alice: pw
      cluster.spec.users:
        - name: '{{ .Values.extraValues.user }}'
    asserts:
      - failedTemplate:
          errorMessage: 'cluster.spec.users "bob" reads password key "bob", but usersSecret.passwords has no entry for it'

  - it: treats enabled null as enabled
    set:
      usersSecret:
        create: true
        name: app-passwords
        passwords:
          alice: pw
      cluster.spec.users:
        - name: alice
          enabled: null
        - name: bob
          enabled: null
    asserts:
      - failedTemplate:
          errorMessage: 'cluster.spec.users "bob" reads password key "bob", but usersSecret.passwords has no entry for it'

  - it: wires a user with enabled null to the renamed Secret
    set:
      usersSecret:
        create: true
        name: app-passwords
        passwords:
          alice: pw
      cluster.spec.users:
        - name: alice
          enabled: null
    asserts:
      - equal:
          path: spec.users[0].passwordSecret.name
          value: app-passwords

  - it: points users at a templated usersSecret.name and checks their keys
    release:
      name: rel
    set:
      usersSecret:
        create: true
        name: "{{ .Release.Name }}-pw"
        passwords:
          alice: pw
      cluster.spec.users:
        - name: alice
        - name: bob
          passwordSecret:
            name: "{{ .Release.Name }}-pw"
    asserts:
      - failedTemplate:
          errorMessage: 'cluster.spec.users "bob" reads password key "bob", but usersSecret.passwords has no entry for it'

  - it: wires users to the rendered usersSecret.name
    release:
      name: rel
    set:
      usersSecret:
        create: true
        name: "{{ .Release.Name }}-pw"
        passwords:
          alice: pw
      cluster.spec.users:
        - name: alice
    asserts:
      - equal:
          path: spec.users[0].passwordSecret.name
          value: rel-pw

  - it: applies the ServiceAccount and the renamed users Secret together
    set:
      fullnameOverride: mt
      serviceAccount:
        create: true
      usersSecret:
        create: true
        name: app-passwords
        passwords:
          alice: pw
      cluster.spec.users:
        - name: alice
    asserts:
      - equal:
          path: spec.serviceAccountName
          value: mt
      - equal:
          path: spec.users[0].passwordSecret.name
          value: app-passwords
