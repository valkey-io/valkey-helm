global:
  # The global image registry (this will override the registry of all container images defined in this chart)
  imageRegistry: ""
  # The global image pull secrets (list of secret names)
  imagePullSecrets: []

image:
  # Image registry
  registry: "docker.io"
  # Valkey container image repository
  repository: valkey/valkey
  # Image pull policy (Always, IfNotPresent, Never)
  pullPolicy: IfNotPresent
  # Image tag (leave empty to use .Chart.AppVersion)
  tag: ""

# List of image pull secrets (for private registries)
imagePullSecrets: []

# Override the default name or full name of resources
nameOverride: ""
fullnameOverride: ""

# Kubernetes cluster domain name
clusterDomain: cluster.local

serviceAccount:
  # Create a service account for Valkey
  create: true
  # Whether to automount the service account token
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # Name of an existing service account to use (if create: false)
  name: ""

# Annotations and labels for the Valkey pods. The Sentinel and HAProxy pods
# take replica.sentinel.podAnnotations/podLabels and haproxy.podAnnotations/podLabels.
podAnnotations: {}
podLabels: {}

# Annotations for the Deployment/StatefulSet resource
workloadAnnotations: {}

# Common labels to add to all resources (Deployment, Service, ConfigMap, etc.)
commonLabels: {}

# Security context for the pod (applies to all containers)
podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Grace period for a terminating Valkey pod, standalone and replication. Valkey
# saves its dataset on shutdown, so raise it for large datasets. With Sentinel
# it must also be longer than replica.sentinel.preStopFailoverTimeoutSeconds,
# otherwise Kubernetes sends SIGKILL while the graceful failover is still running.
terminationGracePeriodSeconds: 30

# Priority class name for pod scheduling (leave empty to use cluster's default)
priorityClassName: ""

# RuntimeClassName for the pods, used to select the container runtime configuration
# (e.g. "gvisor", "kata-containers"). Leave empty to use the cluster's default runtime.
# See https://kubernetes.io/docs/concepts/containers/runtime-class/#usage
runtimeClassName: ""

# Security context for the Valkey containers
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  # Type of Kubernetes service (ClusterIP, NodePort, LoadBalancer)
  type: ClusterIP
  # Port on which Valkey will be exposed
  port: 6379
  annotations: {}
  # NodePort value (if service.type is NodePort)
  nodePort: 0
  # ClusterIP value
  clusterIP: ""
  # Class of a load balancer implementation
  loadBalancerClass: ""
  # If specified and supported by the platform, this will restrict traffic through the cloud-provider load-balancer
  # will be restricted to the specified client IPs.
  # This field will be ignored if the cloud-provider does not support the feature.
  loadBalancerSourceRanges: []
  # Application protocol
  appProtocol: ""

# Network policy to control traffic to the pods
# More info: https://kubernetes.io/docs/concepts/services-networking/network-policies/
networkPolicy: {}

# Resource limits/requests for the main Valkey container
resources: {}
  # Example:
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Resource limits/requests for init containers
initResources: {}
  # Example:
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Init container that writes the Valkey configuration before the server starts
initContainer:
  # Image configuration. The init container runs a shell script, so set a
  # repository when the Valkey image has no shell. Leave repository empty to
  # use the Valkey image (image.*), in which case registry and tag are ignored.
  image:
    # Image registry
    registry: ""
    # Init container image repository (leave empty to use the Valkey image)
    repository: ""
    # Image pull policy (Always, IfNotPresent, Never), leave empty to use image.pullPolicy
    pullPolicy: ""
    # Image tag (leave empty to use .Chart.AppVersion)
    tag: ""

# Health probes for the main Valkey container.
# Each probe is gated on its own `enabled` flag and rendered by the
# `valkey.healthProbes` helper. The default handler is a `valkey-cli ping` exec
# (TLS-aware). Set `customProbe` to a full probe spec to replace the default
# handler and timing entirely (e.g. an httpGet or tcpSocket probe).
# The defaults below match the previous hardcoded behavior (Kubernetes probe
# defaults); readinessProbe is opt-in since the container had none before.
startupProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  customProbe: {}
livenessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  customProbe: {}
readinessProbe:
  enabled: false
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1
  customProbe: {}

# Additional init containers
extraInitContainers: []

# Additional containers
extraContainers: []

# Persistent storage configuration (standalone deployment only)
dataStorage:
  # Enable persistent volume claim creation
  enabled: false

  # Use existing PVC by name (skip dynamic provisioning if set)
  persistentVolumeClaimName: ""

  # Subpath inside PVC to mount
  subPath: ""

  # Name of the volume (referenced in deployment)
  volumeName: "valkey-data"

  # Request size (e.g. 5Gi) for dynamically provisioned volume
  requestedSize: ""

  # Name of the storage class to use
  className: ""

  # Access modes for the PVC (e.g., ReadWriteOnce, ReadWriteMany)
  accessModes:
    - ReadWriteOnce

  # If true, keep the PVC on Helm uninstall
  keepPvc: false

  # Optional annotations to add to the PVC
  annotations: {}

  # Optional labels to add to the PVC
  labels: {}

  # If hostPath is set then a hostPath DirectoryOrCreate volume is used
  hostPath: ""

# Mount additional secrets into the Valkey container
extraValkeySecrets: []

# Mount additional configMaps into the Valkey container
extraValkeyConfigs: []

# Mount extra secrets as volume to init container (deprecated, use extraValkeySecrets)
extraSecretValkeyConfigs: false

# Mount additional emptyDir or hostPath volumes (advanced use)
extraVolumes: []
#  - name: hostpath-volume
#    hostPath:
#      path: /opt/valkey/hostpath-volume/
#      type: DirectoryOrCreate
extraVolumeMounts: []
#  - mountPath: /some/path/
#    name: hostpath-volume

# Content for valkey.conf (will be mounted via ConfigMap)
valkeyConfig: ""

auth:
  # Enable ACL-based authentication
  # IMPORTANT: When authentication is enabled, the 'default' user MUST be defined in either
  # aclUsers or aclConfig. Without a default user, anyone can access the database without
  # credentials, creating a security risk.
  enabled: false

  # Use an existing secret for user passwords. Key defaults to username.
  # Supports templating, e.g.: "users-{{ .Release.Name }}"
  usersExistingSecret: ""

  # Map of users to create with ACL permissions.
  # If usersExistingSecret is set, passwords from the secret take priority over inline passwords.
  # NOTE: If using aclUsers, the 'default' user must be included here.
  aclUsers: {}
  # Example:
  # default:
  #   permissions: "~* &* +@all"
  #   password: "secretpass"        # Inline password (fallback if usersExistingSecret not set)
  #   passwordKey: "admin-pwd"      # Key in usersExistingSecret (defaults to username)
  # read-user:
  #   permissions: "~* -@all +@read +ping +info"

  # Inline ACL configuration that will be appended after generated users.
  # NOTE: If using aclConfig, ensure the 'default' user is defined here.
  aclConfig: ""
  # Example:
  # aclConfig: |
  #   user default on >secretpass ~* &* +@all

# Replica configuration for master-replica replication mode
replica:
  enabled: false

  # Number of replica instances (total pods = replicas + 1 master)
  replicas: 2

  # Username for replicas to authenticate to master, ignored if auth.enabled is false.
  # IMPORTANT: When auth.enabled is true, this user MUST be defined in auth.aclUsers.
  # The chart requires this to retrieve the password for replica authentication.
  # The user must have appropriate replication permissions: +psync +replconf +ping
  replicationUser: "default"

  # Replication settings
  # Use diskless replication (sync directly from memory) vs disk-based
  disklessSync: false

  # Write safety - require minimum number of healthy replicas to accept writes
  # Set to 0 to disable this check, or 1+ to require minimum replicas before accepting writes
  # This ensures data durability by requiring at least N replicas to be in sync
  minReplicasToWrite: 0

  # Maximum replication lag in seconds before a replica is considered unhealthy
  minReplicasMaxLag: 10

  # Read service configuration
  service:
    # Enable read service (load balances read traffic across all pods)
    enabled: true
    # Service type (ClusterIP, NodePort, LoadBalancer)
    type: ClusterIP
    # Port on which the read service will be exposed
    port: 6379
    # Optional annotations for the read service
    annotations: {}
    # NodePort value (if service.type is NodePort)
    nodePort: 0
    # ClusterIP value
    clusterIP: ""
    # Application protocol
    appProtocol: ""
    # Class of a load balancer implementation
    loadBalancerClass: ""
    # If specified and supported by the platform, this will restrict traffic through the cloud-provider load-balancer
    # will be restricted to the specified client IPs.
    # This field will be ignored if the cloud-provider does not support the feature.
    loadBalancerSourceRanges: []

  # Persistence configuration (required for replicas)
  persistence:
    # Size of the PVC for each replica (required when replica.enabled is true)
    size: ""
    # Storage class name (empty = use default storage class)
    storageClass: ""
    # Access modes for the PVC
    accessModes:
      - ReadWriteOnce

  # PersistentVolumeClaim retention policy for StatefulSet
  # Controls when PVCs are deleted (requires Kubernetes 1.23+)
  # More info: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#persistentvolumeclaim-retention
  persistentVolumeClaimRetentionPolicy: {}

  # Valkey Sentinel for automatic failover.
  # Sentinel runs in an independent StatefulSet, monitors the master and
  # promotes a replica when the master becomes unreachable.
  # NOTE: with Sentinel enabled the Valkey service load balances across all pods,
  # because the master can move at any time. Clients must therefore discover the
  # master through Sentinel (SENTINEL get-master-addr-by-name).
  sentinel:
    # Enable Sentinel (requires replica.enabled and at least one replica).
    # The Sentinel endpoint always requires its dedicated password, independently of whether authentication is enabled for the Valkey data endpoint.
    enabled: false

    # Number of Sentinel instances. Keep this at 3 or more so a majority can
    # authorize failover while one Sentinel is unavailable.
    replicas: 3

    # Port on which Sentinel listens
    port: 26379

    # Name Sentinel uses to identify the monitored master
    masterSet: mymaster

    # Number of Sentinels that must agree the master is down before a failover
    # starts. Use a majority of the Sentinel count, e.g. 2 for 3 pods.
    quorum: 2

    # Time in milliseconds after which an unresponsive master is considered down
    downAfterMilliseconds: 5000

    # Time in milliseconds before a failover attempt is considered failed
    failoverTimeout: 60000

    # Number of replicas that resynchronise with the new master simultaneously
    parallelSyncs: 1

    # User Sentinel authenticates with against the Valkey nodes, ignored if
    # auth.enabled is false. Defaults to replica.replicationUser.
    # The user must be defined in auth.aclUsers. Sentinel promotes replicas by
    # sending them SLAVEOF, so a user without those permissions makes every
    # failover abort with -failover-abort-slave-timeout. The minimum is:
    #   ~* &* +multi +exec +ping +info +role +subscribe +publish +slaveof
    #   +replicaof +config|rewrite +client|setname +client|kill +script|kill
    # and, because the same user replicates, +psync +replconf
    monitorUser: ""

    # Dedicated password for Sentinel's own ACL.
    # Do not reuse a Valkey user password because Sentinel permissions are independent from Valkey ACLs.
    # This password is required whenever Sentinel is enabled.
    # When auth.usersExistingSecret is set, passwordKey is looked up in that Secret first.
    # This inline value is used as a fallback when the key is missing.
    password: ""
    passwordKey: "sentinel"

    # Ask Sentinel to promote a replica before this pod shuts down, so that a
    # rolling update does not leave clients writing to a terminating master.
    preStopFailover: true
    # How long to wait for that failover to complete before shutting down anyway.
    # Keep it below terminationGracePeriodSeconds.
    preStopFailoverTimeoutSeconds: 20

    # How long Sentinel waits for a peer or Valkey node on startup before it
    # gives up on discovering the current master and assumes pod-0 is the master
    startupTimeoutSeconds: 60

    # How long a pod with no recorded topology waits for a Sentinel, or for
    # another node, to tell it what the topology is. This is the fresh install
    # case: the Sentinels bootstrap a master once their own
    # startupTimeoutSeconds expires, so this has to be comfortably longer than
    # that: the chart refuses to render unless it is at least 30s above it.
    # A pod that gives up exits, and Kubernetes restarts the init container, so
    # this bounds one attempt rather than the whole startup.
    initialTopologyWaitSeconds: 180

    # How often each Valkey pod mirrors the current master onto its data volume.
    # That record is what a cold start falls back on when no Sentinel answers,
    # so it bounds how stale the topology can be after an abrupt restart.
    # A pod that finds itself named as the master has to see that twice before
    # it is written, because a check landing inside a config rewrite sees the
    # same thing; a pod that finds a master to follow records it at once. The
    # check only reads a file that Valkey keeps up to date, and writes nothing
    # when the topology has not moved.
    masterRecordRefreshSeconds: 1

    # How often each Sentinel looks for a Valkey node that is replicating from
    # something other than the current master and that Sentinel itself cannot
    # see. Sentinel only discovers replicas through the master, so a node that
    # attached to another replica is invisible to it and would never be
    # reconfigured.
    orphanCheckSeconds: 30

    # Raw configuration appended to the generated sentinel.conf.
    # Supports templating, e.g. "sentinel notification-script {{ .Release.Name }} /script.sh"
    extraConfig: ""

    # Resource limits/requests for the Sentinel container
    resources: {}
      # Example:
      # limits:
      #   cpu: 100m
      #   memory: 128Mi
      # requests:
      #   cpu: 10m
      #   memory: 64Mi

    # Security context for the Sentinel container, defaults to securityContext
    securityContext: {}

    # Service exposing the Sentinel endpoints to clients
    service:
      # Enable the Sentinel service
      enabled: true
      # Service type (ClusterIP, NodePort, LoadBalancer)
      type: ClusterIP
      # Port on which the Sentinel service will be exposed
      port: 26379
      # Optional annotations for the Sentinel service
      annotations: {}
      # NodePort value (if service.type is NodePort)
      nodePort: 0
      # ClusterIP value
      clusterIP: ""
      # Application protocol
      appProtocol: ""
      # Class of a load balancer implementation
      loadBalancerClass: ""
      # Restricts traffic through the cloud-provider load balancer to these client IPs
      loadBalancerSourceRanges: []

    # Persistence for the Sentinel state directory. Optional, and off for a
    # reason: Sentinel rewrites its own credentials into sentinel.conf, so
    # enabling this writes them to persistent storage. With it disabled the
    # state sits on a memory backed emptyDir instead.
    persistence:
      # Enable a PVC for the Sentinel state instead of an emptyDir
      enabled: false
      # Size of the PVC for each Sentinel
      size: 100Mi
      # Storage class name (empty = use default storage class)
      storageClass: ""
      # Access modes for the PVC
      accessModes:
        - ReadWriteOnce

    # PersistentVolumeClaim retention policy for the Sentinel StatefulSet.
    persistentVolumeClaimRetentionPolicy: {}

    # Labels and annotations for the Sentinel pods. The top level podLabels and
    # podAnnotations are not applied to the Sentinel pods; commonLabels are.
    podLabels: {}
    podAnnotations: {}

    # Scheduling for the Sentinel pods. nodeSelector and tolerations fall back
    # to the top level values when unset (null); set them to {} / [] to place
    # the Sentinels without any. affinity and
    # topologySpreadConstraints do not, as those written for the Valkey pods
    # select the Valkey pods' labels. priorityClassName and runtimeClassName
    # come from the top level values.
    # Spread the Sentinels across failure domains, so that one node or zone
    # cannot take the quorum down with it, e.g.:
    #   topologySpreadConstraints:
    #     - maxSkew: 1
    #       topologyKey: kubernetes.io/hostname
    #       whenUnsatisfiable: ScheduleAnyway
    #       labelSelector:
    #         matchLabels:
    #           app.kubernetes.io/instance: <release name>
    #           app.kubernetes.io/component: sentinel
    nodeSelector: null
    affinity: {}
    tolerations: null
    topologySpreadConstraints: []

    # PodDisruptionBudget for the Sentinel pods. Without one, a node drain can
    # evict enough Sentinels at once to lose the quorum, and no failover can
    # be authorized until they are back. The chart refuses a budget that lets
    # fewer than max(quorum, majority of replicas) Sentinels keep running.
    podDisruptionBudget:
      # Enable the PodDisruptionBudget
      enabled: false
      # Minimum number of pods that must be available (takes precedence over maxUnavailable if both set)
      minAvailable: null
      # Maximum number of pods that can be unavailable during disruptions.
      # 0 is honoured and forbids every voluntary eviction, which blocks node drains.
      maxUnavailable: 1
      # Unhealthy pod eviction policy (optional)
      # Valid values: IfHealthyBudget, AlwaysAllow
      unhealthyPodEvictionPolicy: ""

# HAProxy in front of a Sentinel setup, for clients that cannot talk to Sentinel.
# It health checks every Valkey node and forwards writes to whichever one answers
# "role:master", so a failover needs no client support and no extra watcher.
haproxy:
  # Enable HAProxy (requires replica.enabled and replica.sentinel.enabled)
  enabled: false

  # Number of HAProxy pods
  replicas: 3

  image:
    # Image registry
    registry: docker.io
    # HAProxy container image repository
    repository: haproxy
    # Image pull policy (Always, IfNotPresent, Never)
    pullPolicy: IfNotPresent
    # Image tag. HAProxy 3.1 or newer is required for the init-state server
    # option, which keeps replicas out of the write backend on startup.
    tag: "3.2-alpine"

  # User HAProxy authenticates with to run its health check, ignored if
  # auth.enabled is false. Must be defined in auth.aclUsers and needs +info
  # and +ping. Defaults to the 'default' user.
  checkUser: ""

  service:
    # Service type (ClusterIP, NodePort, LoadBalancer)
    type: ClusterIP
    # Port forwarding to the current master, for reads and writes
    port: 6379
    # Optional annotations for the HAProxy service
    annotations: {}
    # NodePort value (if service.type is NodePort)
    nodePort: 0
    # ClusterIP value
    clusterIP: ""
    # Class of a load balancer implementation
    loadBalancerClass: ""
    # Restricts traffic through the cloud-provider load balancer to these client IPs
    loadBalancerSourceRanges: []

  config:
    # Maximum number of concurrent connections
    maxconn: 4096
    # Port serving /healthz for the Kubernetes probes. HAProxy answers it
    # itself, so probing does not open connections towards the Valkey nodes.
    # Not published through the service.
    healthPort: 8404
    # How often each Valkey node is health checked. This is also how long a
    # failover takes to be reflected in the routing.
    checkInterval: 2s
    # Maximum duration of a single health check
    checkTimeout: 5s
    timeout:
      connect: 5s
      client: 1m
      server: 1m
      # Timeout for long lived bidirectional connections such as pub/sub.
      # Replaces the client and server timeouts once a connection is
      # established, so an idle SUBSCRIBE is only dropped after this long.
      # 0 does not mean unlimited: it unsets the tunnel timeout and an idle
      # SUBSCRIBE is dropped after the client timeout instead. 24d is close to
      # the largest value HAProxy accepts.
      tunnel: 24d

  tls:
    # With tls.enabled, HAProxy forwards the encrypted stream untouched and the
    # client completes the handshake with the Valkey node itself, so clients
    # must speak TLS and the server certificate has to be valid for the HAProxy
    # service name as well, that being the name clients connect to.
    #
    # Certificate validation for the health check connections to the nodes,
    # only used when tls.enabled is true. Either "required" or "none".
    #
    # "required" validates against tls.caPublicKey and, because HAProxy checks
    # each node separately, also that the certificate it gets back covers that
    # pod's own DNS name. A certificate issued for the service name alone,
    # which is the common case, fails that check and takes every backend down
    # with "Server presented an SSL certificate different from the configured
    # one". Use "none" for such a certificate, or add the pod names to it:
    #   <release>-valkey-<index>.<release>-valkey-headless.<ns>.svc.<domain>
    verify: required
    # Key in tls.existingSecret holding the client certificate HAProxy presents
    # to the nodes, required when tls.requireClientCertificate is true. HAProxy
    # reads the certificate and its private key from one file, so this key must
    # hold both of them concatenated.
    clientCertFile: ""

  # PodDisruptionBudget for the HAProxy pods. Without one, a node drain can
  # evict every replica at once and take the endpoint down entirely.
  podDisruptionBudget:
    # Enable the PodDisruptionBudget
    enabled: false
    # Minimum number of pods that must be available (takes precedence over maxUnavailable if both set)
    minAvailable: null
    # Maximum number of pods that can be unavailable during disruptions.
    # 0 is honoured and forbids every voluntary eviction, which blocks node drains.
    maxUnavailable: 1
    # Unhealthy pod eviction policy (optional)
    # Valid values: IfHealthyBudget, AlwaysAllow
    unhealthyPodEvictionPolicy: ""

  # Resource limits/requests for the HAProxy container
  resources: {}
    # Example:
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi

  # Security context for the HAProxy pod. fsGroup gives the non-root user access
  # to the mounted TLS secret, whose files are owned by root.
  podSecurityContext:
    fsGroup: 99
    runAsUser: 99
    runAsGroup: 99
    seccompProfile:
      type: RuntimeDefault

  # Security context for the HAProxy container
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  # Labels and annotations for the HAProxy pods. The top level podLabels and
  # podAnnotations are not applied to the HAProxy pods; commonLabels are.
  podLabels: {}
  podAnnotations: {}

  # Scheduling for the HAProxy pods. nodeSelector and tolerations fall back
  # to the top level values when unset (null); set them to {} / [] to place
  # the HAProxy pods without any. affinity and
  # topologySpreadConstraints do not, as those written for the Valkey pods
  # select the Valkey pods' labels. priorityClassName and runtimeClassName
  # come from the top level values.
  nodeSelector: null
  affinity: {}
  tolerations: null
  topologySpreadConstraints: []

  # Additional init containers, volumes and volume mounts
  extraInitContainers: []
  extraVolumes: []
  extraVolumeMounts: []

tls:
  # Enable TLS
  enabled: false
  # Name of the Secret containing TLS keys (required)
  existingSecret: ""
  # Secret key name containing server public certificate
  serverPublicKey: server.crt
  # Secret key name containing server private key
  serverKey: server.key
  # Secret key name containing Certificate Authority public certificate
  caPublicKey: ca.crt
  # Secret key name containing DH parameters (optional)
  dhParamKey: ""
  # Require that clients authenticate with a certificate
  requireClientCertificate: false

# Node selector for pod assignment
nodeSelector: {}

# Tolerations for pod assignment to tainted nodes
tolerations: []

# Affinity rules for pod scheduling
affinity: {}

# Set Deployment strategy. See https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
deploymentStrategy: RollingUpdate # @schema enum:[RollingUpdate,Recreate]

# See https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints
topologySpreadConstraints: []

# PodDisruptionBudget configuration (only used in replicated mode)
# Helps keep enough replicas available during voluntary disruptions
podDisruptionBudget:
  # Enable PodDisruptionBudget
  enabled: false
  # Minimum number of pods that must be available (takes precedence over maxUnavailable if both set)
  minAvailable: null
  # Maximum number of pods that can be unavailable during disruptions
  maxUnavailable: 1
  # Unhealthy pod eviction policy (optional)
  # Valid values: IfHealthyBudget, AlwaysAllow
  unhealthyPodEvictionPolicy: ""

# Valkey logging level: debug, verbose, notice, warning
valkeyLogLevel: "notice"
# Environment variables to inject into Valkey container

env: {}
  # Example:
  # LOG_LEVEL: info

metrics:
  # Enable Prometheus exporter sidecar
  enabled: false
  # Exporter configuration
  exporter:
    # Command to run in the metrics exporter container (overrides args)
    command: []
    # Arguments to pass to the metrics exporter container
    args: []
      # Example:
      # - --redis.addr=redis:6379
    # Port on which the metrics exporter will listen
    port: 9121
    # Name the exporter expects in the Valkey server certificate when
    # tls.enabled is true (it connects to localhost). Defaults to the Valkey
    # service name; set it to a name the certificate covers, e.g. the FQDN.
    tlsServerName: ""
    # Image configuration
    image:
      # Image registry
      registry: ghcr.io
      # Prometheus exporter container image repository
      repository: oliver006/redis_exporter
      # Image pull policy (Always, IfNotPresent, Never)
      pullPolicy: IfNotPresent
      # Image tag (required when metrics.enabled is true)
      tag: "v1.88.0"
    resources: {}
      # Example:
      # limits:
      #   cpu: 100m
      #   memory: 128Mi
      # requests:
      #   cpu: 100m
      #   memory: 128Mi
    # Extra volume mounts for metrics exporter container
    extraVolumeMounts: []
    # Additional secrets to mount for metrics exporter
    extraExporterSecrets: []
    # Environment variables to inject into the metrics exporter container
    extraEnvs: {}
    # Example:
    # LOG_LEVEL: info
    securityContext: {}
      # Example:
      # runAsNonRoot: true
      # runAsUser: 1000
      # runAsGroup: 1000
      # capabilities:
      #   drop:
      #     - ALL
      # readOnlyRootFilesystem: true

  # Service configuration for the metrics exporter
  service:
    # Enable a separate service for the metrics exporter
    enabled: true
    # Service type (ClusterIP, NodePort, LoadBalancer)
    type: ClusterIP
    # Port on which the metrics exporter service will be exposed
    ports:
      http: 9121
    # Optional annotations for the metrics exporter service
    annotations: {}
    # Optional labels for the metrics exporter service
    extraLabels: {}
    # ServiceMonitor configuration for Prometheus Operator
    # Application protocol
    appProtocol: ""
  serviceMonitor:
    # Enable ServiceMonitor resource for scraping service metrics
    enabled: false
    # Port name or number to scrape metrics from
    port: metrics
    # Extra labels for the ServiceMonitor resource, e.g. the labels a
    # Prometheus serviceMonitorSelector matches on (release: kube-prometheus-stack)
    extraLabels: {}
    # Extra annotations for the ServiceMonitor resource
    annotations: {}
    # How often Prometheus should scrape metrics
    interval: 30s
    # Maximum duration allowed for a scrape request
    scrapeTimeout: ""
    # Relabeling rules applied before scraping metrics
    relabelings: []
    # Relabeling rules applied before ingesting metrics
    metricRelabelings: []
    # Set honorLabels to true to preserve original metric labels
    honorLabels: false
    # Pod labels to copy onto the generated metrics
    podTargetLabels: []
    # Maximum number of samples to collect per scrape (an integer; false for no limit)
    sampleLimit: false
    # Maximum number of scrape targets allowed (an integer; false for no limit)
    targetLimit: false
  podMonitor:
    # Enable PodMonitor resource for scraping pod metrics
    enabled: false
    # Port name or number to scrape metrics from
    port: metrics
    # Extra labels for the PodMonitor resource, e.g. the labels a
    # Prometheus podMonitorSelector matches on (release: kube-prometheus-stack)
    extraLabels: {}
    # Extra annotations for the PodMonitor resource
    annotations: {}
    # Frequency for Prometheus to scrape pod metrics
    interval: 30s
    # Time limit for each scrape operation
    scrapeTimeout: ""
    # Relabeling rules to apply before scraping pod metrics
    relabelings: []
    # Relabeling rules to apply before ingesting pod metrics
    metricRelabelings: []
    # If true, keeps original labels from the pod metrics
    honorLabels: false
    # Pod labels to attach to the metrics
    podTargetLabels: []
    # Maximum samples to scrape from each Pod (an integer; false for no limit)
    sampleLimit: false
    # Maximum number of pods to scrape (an integer; false for no limit)
    targetLimit: false

  # PrometheusRule configuration for alerting rules (used by kube-prometheus-stack)
  prometheusRule:
