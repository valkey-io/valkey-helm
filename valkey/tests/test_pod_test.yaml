suite: test pods
templates:
  - templates/tests/auth.yaml
tests:
  - it: should not render test pods when auth disabled
    set:
      auth.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render generated user test pod with inline passwords
    set:
      auth.enabled: true
      auth.aclUsers:
        admin:
          permissions: "~* &* +@all"
          password: "admin-password"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Pod
      - equal:
          path: metadata.name
          value: RELEASE-NAME-valkey-test-auth-generated
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - equal:
          path: spec.restartPolicy
          value: Never
      - contains:
          path: spec.volumes
          content:
            name: valkey-auth
            secret:
              secretName: RELEASE-NAME-valkey-auth

  - it: should render existing secret test pod only
    set:
      auth.enabled: true
      auth.usersExistingSecret: "my-secret"
      auth.aclUsers:
        admin:
          permissions: "~* &* +@all"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Pod
      - equal:
          path: metadata.name
          value: RELEASE-NAME-valkey-test-auth-existing
      - contains:
          path: spec.volumes
          content:
            name: valkey-users-secret
            secret:
              secretName: my-secret

  - it: should render existing secret test pod with templated usersExistingSecret
    set:
      auth.enabled: true
      auth.usersExistingSecret: "my-secret-{{ .Release.Name }}"
      auth.aclUsers:
        admin:
          permissions: "~* &* +@all"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Pod
      - contains:
          path: spec.volumes
          content:
            name: valkey-users-secret
            secret:
              secretName: my-secret-RELEASE-NAME

  - it: should not render test pods with aclConfig only
    set:
      auth.enabled: true
      auth.aclConfig: "user admin on >password ~* &* +@all"
    asserts:
      - hasDocuments:
          count: 0

  - it: generated test pod should have correct command structure
    set:
      auth.enabled: true
      auth.aclUsers:
        testuser:
          permissions: "~* &* +@all"
          password: "test-password"
    asserts:
      - isKind:
          of: Pod
      - contains:
          path: spec.containers[0].command
          content: sh
      - contains:
          path: spec.containers[0].volumeMounts
          content:
            name: valkey-auth
            mountPath: /valkey-auth
            readOnly: true

  - it: test pods should have hook deletion policy
    set:
      auth.enabled: true
      auth.aclUsers:
        admin:
          permissions: "~* &* +@all"
          password: "admin-password"
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded

  # The test pods run alongside the workload, so they have to pass the same
  # admission rules (e.g. the restricted Pod Security Standard).
  - it: should run the test pods with the chart's security contexts
    set:
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          password: "pw"
      global.imagePullSecrets: ["regcred"]
    asserts:
      - equal:
          path: spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.automountServiceAccountToken
          value: false
      - contains:
          path: spec.imagePullSecrets
          content:
            name: regcred

  - it: should present a client certificate when the nodes require one
    set:
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          password: "pw"
      tls.enabled: true
      tls.existingSecret: valkey-tls
      tls.requireClientCertificate: true
    asserts:
      - matchRegex:
          path: spec.containers[0].command[2]
          pattern: 'TLS_FLAGS="--tls --cacert /tls/ca.crt --cert /tls/server.crt --key /tls/server.key"'

  # valkey.hasInlinePasswords also counts the Sentinel password, which is no
  # user to authenticate as.
  - it: should not render the inline password test for a Sentinel-only inline password
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: 1Gi
      sentinel.enabled: true
      sentinel.password: sentinel-password
      auth.enabled: true
      auth.usersExistingSecret: users
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-valkey-test-auth-existing
