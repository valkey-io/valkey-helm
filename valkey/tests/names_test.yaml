suite: resource names fit their length limits
templates:
  - templates/service-headless.yaml
  - templates/service-read.yaml
  - templates/metrics-svc.yaml
  - templates/haproxy-service.yaml
  - templates/statefulset.yaml
  - templates/init_config.yaml
  - templates/secret.yaml
  - templates/sentinel-headless-service.yaml
  - templates/sentinel-statefulset.yaml
  - templates/sentinel-configmap.yaml
  - templates/haproxy-configmap.yaml
  - templates/service.yaml
set:
  # The longest full name the chart produces; every suffixed name must
  # still fit the 63 characters Kubernetes allows for Service, container,
  # volume names and label values.
  fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  replica.enabled: true
  persistence.enabled: true
  persistence.size: 1Gi
  sentinel.enabled: true
  sentinel.password: sentinel-password
  haproxy.enabled: true
  metrics.enabled: true
  tls.enabled: true
  tls.existingSecret: valkey-tls
tests:
  - it: should keep the headless service name within 63 characters
    template: templates/service-headless.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^a{54}-headless$'

  - it: should keep the read service name within 63 characters
    template: templates/service-read.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^a{58}-read$'

  - it: should keep the metrics service name within 63 characters
    template: templates/metrics-svc.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^a{55}-metrics$'

  - it: should keep the haproxy service name and label within 63 characters
    template: templates/haproxy-service.yaml
    set:
      nameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^a{55}-haproxy$'
      - matchRegex:
          path: spec.selector["app.kubernetes.io/name"]
          pattern: '^a{55}-haproxy$'

  - it: should keep the headless service and TLS volume names within 63 characters
    template: templates/statefulset.yaml
    asserts:
      - matchRegex:
          path: spec.serviceName
          pattern: '^a{54}-headless$'
      - contains:
          path: spec.template.spec.volumes
          content:
            name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-tls
            secret:
              secretName: valkey-tls
              defaultMode: 0400

  - it: should use the shortened headless name in the init scripts
    template: templates/init_config.yaml
    asserts:
      - matchRegex:
          path: data["init.sh"]
          pattern: '\.a{54}-headless\.NAMESPACE\.svc'

  # ConfigMap names allow 253 characters, so this one keeps the full name
  - it: should keep the full name for the init scripts ConfigMap
    template: templates/init_config.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^a{63}-init-scripts$'

  - it: should mount the init scripts ConfigMap under its full name
    template: templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: scripts
            configMap:
              name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-init-scripts
              defaultMode: 0555

  # Shortening "<fullname>-sentinel" to make room for a headless suffix used
  # to cut "-sentinel" off and give both headless services the same name.
  - it: should keep the Sentinel headless service name distinct and within 63 characters
    template: templates/sentinel-headless-service.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^a{51}-sentinel-hl$'

  # Kubernetes labels each StatefulSet pod controller-revision-hash:
  # <statefulset name>-<10 character hash>, so a StatefulSet name above 52
  # characters makes every pod creation fail.
  - it: should keep the Valkey StatefulSet name within 52 characters
    template: templates/statefulset.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^a{52}$'

  - it: should keep the Sentinel StatefulSet name within 52 characters
    template: templates/sentinel-statefulset.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: '^a{43}-sentinel$'

  - it: should address the Valkey pods by the StatefulSet name
    template: templates/init_config.yaml
    asserts:
      - matchRegex:
          path: data["init.sh"]
          pattern: 'SELF_HOST="a{52}-\$POD_INDEX\.a{54}-headless\.'
      - matchRegex:
          path: data["init.sh"]
          pattern: 'MASTER_HOST="a{52}-0\.a{54}-headless\.'

  - it: should address the Valkey pods by the StatefulSet name in the Sentinel scripts
    template: templates/sentinel-configmap.yaml
    asserts:
      - matchRegex:
          path: data["sentinel-start.sh"]
          pattern: 'DEFAULT_MASTER_HOST="a{52}-0\.'
      - matchRegex:
          path: data["sentinel-start.sh"]
          pattern: 'node="a{52}-\$\{i\}\.a{54}-headless\.'

  - it: should address the Valkey pods by the StatefulSet name in HAProxy
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'server a{52}-0 a{52}-0\.a{54}-headless\.'

  - it: should select the first Valkey pod by the StatefulSet name
    set:
      sentinel.enabled: false
      haproxy.enabled: false
    template: templates/service.yaml
    asserts:
      - equal:
          path: spec.selector["statefulset.kubernetes.io/pod-name"]
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-0
