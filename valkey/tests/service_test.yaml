suite: service configuration
templates:
  - templates/service.yaml
tests:
  - it: should have correct default service type
    template: templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP
  - it: should be able to set custom clusterIP
    set:
      service.clusterIP: "10.0.0.1"
    template: templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.clusterIP
          value: "10.0.0.1"
  - it: should have correct default ports
    template: templates/service.yaml
    asserts:
      - contains:
          path: spec.ports
          content:
            port: 6379
            targetPort: tcp
            protocol: TCP
            name: tcp
  - it: should be able to set custom nodePort
    set:
      service.type: "NodePort"
      service.nodePort: 30080
    template: templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].nodePort
          value: 30080
  - it: should be able to set custom appProtocol
    set:
      service.appProtocol: "my-protocol"
    template: templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.ports[0].appProtocol
          value: "my-protocol"
  - it: should be able to set custom loadBalancerClass
    set:
      service.loadBalancerClass: "custom-lb-class"
    template: templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.loadBalancerClass
          value: "custom-lb-class"
  - it: shouldn't have loadBalancerClass by default
    template: templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - notExists:
          path: spec.loadBalancerClass
  - it: should be able to set loadBalancerSourceRanges
    set:
      service.loadBalancerSourceRanges: ["10.0.0.1"]
    template: templates/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.loadBalancerSourceRanges
          value: ["10.0.0.1"]
  - it: should have correct selector labels
    template: templates/service.yaml
    asserts:
      - isSubset:
          path: spec.selector
          content:
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/name: valkey

  - it: should not call itself the primary endpoint in sentinel mode
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
      replica.sentinel.enabled: true
      replica.sentinel.password: "sentinelpw"
    template: templates/service.yaml
    asserts:
      # The master can be any pod and a Service cannot select on a role that
      # moves, so this one reaches every node. Labelling it primary would say
      # the opposite of what the endpoint does.
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: nodes
      - notExists:
          path: spec.selector["statefulset.kubernetes.io/pod-name"]

  - it: should pin to pod-0 and call itself primary without sentinel
    set:
      replica.enabled: true
      replica.persistence.size: "5Gi"
    template: templates/service.yaml
    asserts:
      # Without Sentinel the master is pod-0 for the life of the release, so
      # the Service can and does select exactly it.
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: primary
      - equal:
          path: spec.selector["statefulset.kubernetes.io/pod-name"]
          value: RELEASE-NAME-valkey-0
