suite: haproxy configuration
templates:
  - templates/haproxy-configmap.yaml
  - templates/haproxy-deployment.yaml
  - templates/haproxy-service.yaml
  - templates/haproxy-pdb.yaml
  - templates/secret.yaml
set:
  replica.enabled: true
  persistence.enabled: true
  persistence.size: "5Gi"
  sentinel.enabled: true
  haproxy.enabled: true
tests:
  - it: should fail when sentinel is not enabled
    set:
      sentinel.enabled: false
    template: templates/haproxy-deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: "HAProxy routes clients to whichever node Sentinel promoted.*"

  - it: should fail when the check user is missing from aclUsers
    set:
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          password: "pw"
      haproxy.checkUser: "missing-user"
    template: templates/haproxy-deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: "HAProxy check user 'missing-user' must be defined in auth.aclUsers.*"

  - it: should route the write port to the node that reports role:master
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'tcp-check send info\\ replication\\r\\n\n  tcp-check send QUIT\\r\\n\n  tcp-check expect string role:master'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'backend valkey_master'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'server RELEASE-NAME-valkey-2 RELEASE-NAME-valkey-2\.RELEASE-NAME-valkey-headless\.NAMESPACE\.svc\.cluster\.local:6379'

  - it: should keep a node out of the write backend until it proves it is master
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'fall 1 rise 1 init-addr last,libc,none init-state down .*on-marked-down shutdown-sessions'

  - it: should keep pub/sub connections open
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'timeout tunnel 24d'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'option clitcpka'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'option srvtcpka'

  - it: should refuse a tunnel timeout of zero
    set:
      haproxy.config.timeout.tunnel: 0s
    template: templates/haproxy-deployment.yaml
    asserts:
      # HAProxy reads 0 as unset, so idle SUBSCRIBE connections would be
      # dropped after timeout.client instead of being kept open.
      - failedTemplate:
          errorPattern: "haproxy.config.timeout.tunnel must be greater than 0.*"

  - it: should render one server per valkey pod
    set:
      replica.replicas: 5
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'server RELEASE-NAME-valkey-4 '
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: 'server RELEASE-NAME-valkey-5 '

  - it: should not authenticate the Valkey health check when auth is disabled
    template: templates/haproxy-configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: 'tcp-check send AUTH\\ default'

  - it: should take the health check password from the secret, never the configmap
    set:
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          password: "supersecret"
    templates:
      - templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'tcp-check send AUTH\\ default\\ "\$\{VALKEY_CHECK_PASSWORD\}"'
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: 'supersecret'

  - it: should read the health check password from the generated auth secret
    set:
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          password: "pw"
    template: templates/haproxy-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_CHECK_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-valkey-auth
                key: default-password

  - it: should read the health check password from an existing secret
    set:
      auth.enabled: true
      auth.usersExistingSecret: "my-users"
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: "admin-pwd"
    template: templates/haproxy-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_CHECK_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-users
                key: admin-pwd

  - it: should read the Sentinel password from the generated auth secret
    template: templates/haproxy-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SENTINEL_CHECK_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-valkey-auth
                key: sentinel-password

  - it: should read the Sentinel password from sentinel.existingSecret
    set:
      sentinel.password: ""
      sentinel.existingSecret: "my-sentinel"
      sentinel.passwordKey: "pw"
    template: templates/haproxy-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SENTINEL_CHECK_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-sentinel
                key: pw

  - it: should run without a writable root filesystem and without extra tooling
    template: templates/haproxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - notExists:
          path: spec.template.spec.containers[0].command

  - it: should verify the node certificates when TLS is enabled
    set:
      tls.enabled: true
      tls.existingSecret: "valkey-tls"
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'tcp-check connect port 6379 ssl'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'ssl ca-file /tls/ca.crt verify required'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'server RELEASE-NAME-valkey-0 .* verifyhost RELEASE-NAME-valkey-0\.RELEASE-NAME-valkey-headless\.NAMESPACE\.svc\.cluster\.local'

  - it: should skip certificate verification when asked to
    set:
      tls.enabled: true
      tls.existingSecret: "valkey-tls"
      haproxy.tls.verify: none
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'ssl verify none'
      # Anchored on the server lines: the comments above the check rules
      # mention both keywords to explain why they are not used there.
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: '(?m)^\s*server .*(verifyhost| sni )'

  - it: should expose a write port
    template: templates/haproxy-service.yaml
    asserts:
      # Reads go to the valkey-read Service, which selects the same pods.
      # A second data path through the proxy only adds health checks.
      - equal:
          path: spec.ports[0].port
          value: 6379
      - equal:
          path: spec.ports[0].targetPort
          value: valkey-write
      - lengthEqual:
          path: spec.ports
          count: 1


  # role:master alone also matches an old master that Sentinel has not demoted
  # yet, and the writes it takes are discarded when it resyncs.
  - it: should route only to the node a majority of Sentinels name as master
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'default-server weight 0 check'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'use-server RELEASE-NAME-valkey-1 if \{ srv_is_up\(valkey_master/RELEASE-NAME-valkey-1\) \} \{ nbsrv\(sentinel_master_1\) ge 2 \} \{ nbsrv\(sentinel_master_0\) lt 2 \} \{ nbsrv\(sentinel_master_2\) lt 2 \}\n'
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: 'balance '

  - it: should ask every Sentinel which node is the master
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'backend sentinel_master_2\n'
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: 'backend sentinel_master_3'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'tcp-check send AUTH\\ sentinel\\ "\$\{SENTINEL_CHECK_PASSWORD\}"\\r\\n'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'tcp-check send SENTINEL\\ get-master-addr-by-name\\ mymaster\\r\\n'
      # Sentinel has no QUIT: min-recv makes a mismatch final instead of a
      # wait for "timeout check".
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'tcp-check expect min-recv 1 string RELEASE-NAME-valkey-2\.RELEASE-NAME-valkey-headless\.NAMESPACE\.svc\.cluster\.local\\r\\n'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'server RELEASE-NAME-valkey-sentinel-2 RELEASE-NAME-valkey-sentinel-2\.RELEASE-NAME-valkey-sentinel-hl\.NAMESPACE\.svc\.cluster\.local:26379\n'

  - it: should require a majority of all Sentinels, not the failover quorum
    set:
      sentinel.replicas: 5
      sentinel.quorum: 2
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: '\{ nbsrv\(sentinel_master_0\) ge 3 \}'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'server RELEASE-NAME-valkey-sentinel-4 '

  - it: should verify the Sentinel certificates when TLS is enabled
    set:
      tls.enabled: true
      tls.existingSecret: "valkey-tls"
      tls.requireClientCertificate: true
      haproxy.tls.clientCertFile: "haproxy.pem"
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'backend sentinel_master_0\n(.*\n)*?  tcp-check connect ssl\n'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'backend sentinel_master_0\n(.*\n)*?  default-server .* ca-file /tls/ca.crt verify required crt /tls/haproxy.pem\n'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'server RELEASE-NAME-valkey-sentinel-0 \S+ verifyhost RELEASE-NAME-valkey-sentinel-0\.RELEASE-NAME-valkey-sentinel-hl\.NAMESPACE\.svc\.cluster\.local\n'

  - it: should verify the pod name the StatefulSet actually uses for long names
    set:
      fullnameOverride: "a-very-long-release-name-that-goes-past-the-statefulset-limit"
      tls.enabled: true
      tls.existingSecret: "valkey-tls"
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'server a-very-long-release-name-that-goes-past-the-stateful-0 \S+ verifyhost a-very-long-release-name-that-goes-past-the-stateful-0\.'

  - it: should make the TLS secret readable for the non-root user
    set:
      tls.enabled: true
      tls.existingSecret: "valkey-tls"
    template: templates/haproxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].secret.defaultMode
          value: 0440
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 99

  - it: should mount only the CA certificate from the TLS secret
    set:
      tls.enabled: true
      tls.existingSecret: "valkey-tls"
    template: templates/haproxy-deployment.yaml
    asserts:
      # The secret also holds the Valkey server's private key.
      - equal:
          path: spec.template.spec.volumes[1].secret.items
          value:
            - key: ca.crt
              path: ca.crt

  - it: should mount the client certificate bundle next to the CA
    set:
      tls.enabled: true
      tls.existingSecret: "valkey-tls"
      tls.requireClientCertificate: true
      haproxy.tls.clientCertFile: "client.pem"
    template: templates/haproxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[1].secret.items
          value:
            - key: ca.crt
              path: ca.crt
            - key: client.pem
              path: client.pem

  - it: should not mount the TLS secret when HAProxy reads nothing from it
    set:
      tls.enabled: true
      tls.existingSecret: "valkey-tls"
      haproxy.tls.verify: none
    template: templates/haproxy-deployment.yaml
    asserts:
      # An empty items list would project every key, so the volume is omitted.
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1

  - it: should fail when a client certificate is required but no bundle is given
    set:
      tls.enabled: true
      tls.existingSecret: "valkey-tls"
      tls.requireClientCertificate: true
    template: templates/haproxy-deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: "tls.requireClientCertificate needs haproxy.tls.clientCertFile.*"

  - it: should present the configured client certificate bundle
    set:
      tls.enabled: true
      tls.existingSecret: "valkey-tls"
      tls.requireClientCertificate: true
      haproxy.tls.clientCertFile: "client.pem"
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'crt /tls/client.pem'

  - it: should never originate TLS towards the nodes
    set:
      tls.enabled: true
      tls.existingSecret: "valkey-tls"
    template: templates/haproxy-configmap.yaml
    asserts:
      # Only the health check speaks TLS. Terminating the client leg would put
      # one proxy certificate in front of every client, so a node that maps a
      # certificate to a user would give them all that user's rights.
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: '(?m)^\s*default-server .*[^k-]ssl '
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: 'sni str'
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: '(?m)^\s*bind .*ssl'

  - it: should keep client TLS end to end by default
    set:
      tls.enabled: true
      tls.existingSecret: "valkey-tls"
    template: templates/haproxy-configmap.yaml
    asserts:
      # check-ssl, not ssl: only the health check is encrypted by HAProxy, the
      # client stream is forwarded untouched so the client can negotiate TLS
      # with the node itself.
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'default-server .* check-ssl ca-file /tls/ca.crt verify required'
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: 'default-server .* [^-]ssl ca-file'
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'tcp-check connect port 6379 ssl'
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: ' sni '


  - it: should not add TLS options when TLS is disabled
    template: templates/haproxy-configmap.yaml
    asserts:
      # Anchored on the directives: the comment above the check rules explains
      # where TLS for a check belongs, so it names the keywords.
      - notMatchRegex:
          path: data["haproxy.cfg"]
          pattern: '(?m)^\s*(tcp-check connect|default-server|server) .*ssl'

  - it: should probe haproxy itself instead of proxying probes to the nodes
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: 'frontend health\n  bind \*:8404\n  mode http\n  monitor-uri /healthz'

  - it: should point the kubernetes probes at the monitor endpoint
    template: templates/haproxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: health
      - notExists:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: health
            containerPort: 8404
            protocol: TCP

  - it: should drain the quit reply so checks close cleanly
    template: templates/haproxy-configmap.yaml
    asserts:
      - matchRegex:
          path: data["haproxy.cfg"]
          pattern: '\nbackend valkey_master\n(.*\n)*?  tcp-check send QUIT\\r\\n\n  tcp-check expect string role:master\n(  #.*\n)*  tcp-check expect string \+OK'

  - it: should not answer to the valkey selectors
    template: templates/haproxy-deployment.yaml
    asserts:
      # The valkey PodDisruptionBudget, headless service and sentinel service
      # all select on name plus instance without a component. Carrying the
      # valkey name here would put the proxy pods behind all of them.
      - notEqual:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: valkey
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: valkey-haproxy

  - it: should keep the haproxy service pointed only at proxy pods
    template: templates/haproxy-service.yaml
    asserts:
      - notEqual:
          path: spec.selector["app.kubernetes.io/name"]
          value: valkey
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: valkey-haproxy

  - it: should label the proxy pods so no valkey selector matches them
    template: templates/haproxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: valkey-haproxy
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: haproxy

  - it: should not budget disruptions unless asked to
    template: templates/haproxy-pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should keep haproxy replicas available across a node drain
    set:
      haproxy.podDisruptionBudget.enabled: true
    template: templates/haproxy-pdb.yaml
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: RELEASE-NAME-valkey-haproxy
      - equal:
          path: spec.maxUnavailable
          value: 1
      # The selector has to match the deployment's, a PDB that selects nothing
      # is silently no protection at all.
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: valkey-haproxy
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: haproxy

  - it: should prefer minAvailable over maxUnavailable, they are mutually exclusive
    set:
      haproxy.podDisruptionBudget.enabled: true
      haproxy.podDisruptionBudget.minAvailable: 2
    template: templates/haproxy-pdb.yaml
    asserts:
      - equal:
          path: spec.minAvailable
          value: 2
      - notExists:
          path: spec.maxUnavailable

  - it: should honour minAvailable of zero rather than falling back
    set:
      haproxy.podDisruptionBudget.enabled: true
      haproxy.podDisruptionBudget.minAvailable: 0
    template: templates/haproxy-pdb.yaml
    asserts:
      - equal:
          path: spec.minAvailable
          value: 0
      - notExists:
          path: spec.maxUnavailable

  - it: should honour maxUnavailable of zero, which forbids every eviction
    set:
      haproxy.podDisruptionBudget.enabled: true
      haproxy.podDisruptionBudget.maxUnavailable: 0
    template: templates/haproxy-pdb.yaml
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 0
      - notExists:
          path: spec.minAvailable

  - it: should fail when the budget would constrain nothing
    set:
      haproxy.podDisruptionBudget.enabled: true
      haproxy.podDisruptionBudget.minAvailable: null
      haproxy.podDisruptionBudget.maxUnavailable: null
    template: templates/haproxy-pdb.yaml
    asserts:
      - failedTemplate:
          errorPattern: "haproxy.podDisruptionBudget needs either minAvailable or maxUnavailable.*"

  - it: should set the unhealthy pod eviction policy when given
    set:
      haproxy.podDisruptionBudget.enabled: true
      haproxy.podDisruptionBudget.unhealthyPodEvictionPolicy: AlwaysAllow
    template: templates/haproxy-pdb.yaml
    asserts:
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow

  - it: should not render anything when haproxy is disabled
    set:
      haproxy.enabled: false
      haproxy.podDisruptionBudget.enabled: true
    templates:
      - templates/haproxy-configmap.yaml
      - templates/haproxy-deployment.yaml
      - templates/haproxy-service.yaml
      - templates/haproxy-pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  # HAProxy reads the health check password from an environment variable when
  # it starts, so a password change has to restart it like the Valkey pods.
  - it: should restart HAProxy when an inline password changes
    set:
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          password: "pw"
    template: templates/haproxy-deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secret"]
          pattern: '^[0-9a-f]{32}$'

  # The Sentinel health check reads the Sentinel password the same way.
  - it: should restart HAProxy when the inline Sentinel password changes
    set:
      sentinel.password: "sentinel-password"
    template: templates/haproxy-deployment.yaml
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/secret"]
          pattern: '^[0-9a-f]{32}$'

  - it: should not add a secret checksum when passwords come from usersExistingSecret only
    set:
      auth.enabled: true
      auth.usersExistingSecret: "my-secret"
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
    template: templates/haproxy-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/secret"]

  - it: should render several loadBalancerSourceRanges as a yaml list
    set:
      haproxy.service.type: LoadBalancer
      haproxy.service.loadBalancerSourceRanges: ["10.0.0.1/32", "192.168.0.0/16"]
    template: templates/haproxy-service.yaml
    asserts:
      - equal:
          path: spec.loadBalancerSourceRanges
          value: ["10.0.0.1/32", "192.168.0.0/16"]

  - it: should use the top level runtimeClassName like the Valkey and Sentinel pods
    set:
      runtimeClassName: gvisor
    template: templates/haproxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.runtimeClassName
          value: gvisor

  - it: should leave runtimeClassName unset by default
    template: templates/haproxy-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: should label the HAProxy resources with the release's Valkey version
    template: templates/haproxy-deployment.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "9.1.2"
      - notExists:
          path: spec.selector.matchLabels["app.kubernetes.io/version"]

  - it: should not apply the Valkey pod labels or annotations to HAProxy
    set:
      podLabels:
        valkey-only: "true"
      podAnnotations:
        valkey-only: "true"
    template: templates/haproxy-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.labels.valkey-only
      - notExists:
          path: spec.template.metadata.annotations.valkey-only

  - it: should render the HAProxy pod labels and annotations
    set:
      haproxy.podLabels:
        team: proxy
      haproxy.podAnnotations:
        note: proxy
      commonLabels:
        common: "true"
    template: templates/haproxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: proxy
      - equal:
          path: spec.template.metadata.labels.common
          value: "true"
      - equal:
          path: spec.template.metadata.annotations.note
          value: proxy
      - exists:
          path: spec.template.metadata.annotations["checksum/config"]

  - it: should inherit the top level nodeSelector and tolerations by default
    set:
      nodeSelector:
        pool: valkey
      tolerations:
        - key: valkey
          operator: Exists
    template: templates/haproxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            pool: valkey
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: valkey
              operator: Exists

  - it: should place HAProxy without a nodeSelector or tolerations when set to empty
    set:
      nodeSelector:
        pool: valkey
      tolerations:
        - key: valkey
          operator: Exists
      haproxy.nodeSelector: {}
      haproxy.tolerations: []
    template: templates/haproxy-deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
