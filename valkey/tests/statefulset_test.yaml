suite: statefulset configuration
templates:
  - templates/statefulset.yaml
  - templates/init_config.yaml
  - templates/secret.yaml
tests:
  - it: should fail when replica enabled but no size provided
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: ""
    template: templates/statefulset.yaml
    asserts:
      - failedTemplate:
          errorPattern: "Replication requires persistent storage.*"

  - it: should succeed when replica enabled with size provided
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "5Gi"

  - it: should succeed when replica enabled with custom storageClass
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "10Gi"
      persistence.storageClass: "fast-ssd"
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "10Gi"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: "fast-ssd"

  - it: should always have annotations block even without podAnnotations
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      podAnnotations: null
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - exists:
          path: spec.template.metadata.annotations
      - exists:
          path: spec.template.metadata.annotations["checksum/initconfig"]

  - it: should include podAnnotations when provided
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      podAnnotations:
        prometheus.io/scrape: "true"
        custom.annotation: "value"
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["custom.annotation"]
          value: value
      - exists:
          path: spec.template.metadata.annotations["checksum/initconfig"]

  - it: should use image pull policy for containers, initContainers and metrics
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      image.pullPolicy: Always
      metrics.enabled: true
      metrics.exporter.image.pullPolicy: Always
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.initContainers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: Always

  - it: should not have imagePullSecrets when not configured
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: should render imagePullSecrets from values.imagePullSecrets
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      imagePullSecrets:
        - myregistrykey
        - anotherregistrykey
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: myregistrykey
            - name: anotherregistrykey

  - it: should render imagePullSecrets from global.imagePullSecrets
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      global.imagePullSecrets:
        - globalregistrykey
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: globalregistrykey

  - it: should merge global and local imagePullSecrets
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      global.imagePullSecrets:
        - globalregistrykey
      imagePullSecrets:
        - localregistrykey
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: globalregistrykey
            - name: localregistrykey

  - it: should include extraContainers when provided
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      extraContainers:
        - name: nginx
          image: registry.hub.docker.com/nginx/nginx:stable-alpine
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.containers[1].name
          value: nginx
  - it: should render extraVolumes
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      extraVolumes:
        - name: extra-config
          configMap:
            name: my-config
        - name: extra-secret
          secret:
            secretName: my-secret
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-config
            configMap:
              name: my-config
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-secret
            secret:
              secretName: my-secret

  - it: should render extraVolumeMounts for main container
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      extraVolumeMounts:
        - name: extra-config
          mountPath: /extra-config
          readOnly: true
        - name: extra-data
          mountPath: /extra/data
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-config
            mountPath: /extra-config
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-data
            mountPath: /extra/data

  - it: should render both extraVolumes and extraVolumeMounts together
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      extraVolumes:
        - name: extra-config
          configMap:
            name: my-config
      extraVolumeMounts:
        - name: extra-config
          mountPath: /extra-config
          readOnly: true
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-config
            configMap:
              name: my-config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-config
            mountPath: /extra-config
            readOnly: true

  - it: should include persistentVolumeClaimRetentionPolicy when configured
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      replica.persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Delete
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy.whenDeleted
          value: Retain
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy.whenScaled
          value: Delete

  - it: should include workload annotations when provided
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      workloadAnnotations:
        example.com/annotation: "test-value"
        custom.annotation: "custom-value"
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.annotations["example.com/annotation"]
          value: "test-value"
      - equal:
          path: metadata.annotations["custom.annotation"]
          value: "custom-value"

  - it: should render users-secret volume with templated usersExistingSecret
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      auth.enabled: true
      auth.usersExistingSecret: "my-custom-secret-{{ .Release.Name }}"
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - contains:
          path: spec.template.spec.volumes
          content:
            name: valkey-users-secret
            secret:
              secretName: my-custom-secret-RELEASE-NAME
              defaultMode: 0400

  - it: should not have REDIS_PASSWORD env in metrics exporter when auth is disabled
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      auth.enabled: false
      metrics.enabled: true
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - notContains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_PASSWORD

  - it: should set REDIS_PASSWORD from generated secret in metrics exporter when auth is enabled
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          password: "default-password"
      metrics.enabled: true
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-valkey-auth
                key: default-password

  - it: should set REDIS_PASSWORD from existing secret in metrics exporter when usersExistingSecret is set
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      auth.enabled: true
      auth.usersExistingSecret: "my-custom-secret"
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
      metrics.enabled: true
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-custom-secret
                key: default

  - it: should render templated usersExistingSecret in metrics exporter
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      auth.enabled: true
      auth.usersExistingSecret: "my-custom-secret-{{ .Release.Name }}"
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
      metrics.enabled: true
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-custom-secret-RELEASE-NAME
                key: default

  - it: should set REDIS_PASSWORD using custom passwordKey in metrics exporter when usersExistingSecret is set
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      auth.enabled: true
      auth.usersExistingSecret: "my-custom-secret"
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: "my-password-key"
      metrics.enabled: true
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-custom-secret
                key: my-password-key
  - it: should not set runtimeClassName when empty
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      runtimeClassName: ""
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: should set runtimeClassName when provided
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      runtimeClassName: "kata-containers"
    template: templates/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.template.spec.runtimeClassName
          value: "kata-containers"

  # The pod template is shared with the Deployment, which is the only one of
  # the two that adds extraVolumeMounts to the init container.
  - it: should not render extraVolumeMounts for the init container
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: 1Gi
      extraVolumeMounts:
        - name: extra-data
          mountPath: /extra/data
    template: templates/statefulset.yaml
    asserts:
      - notContains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: extra-data
            mountPath: /extra/data
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-data
            mountPath: /extra/data

  # The pod_index fallback for clusters without the pod-index label reads
  # POD_NAME; HOSTNAME is not guaranteed and can be an FQDN.
  - it: should give the init and main containers the pod name
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: 1Gi
    template: templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: should set the termination grace period on the replication pods
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      terminationGracePeriodSeconds: 90
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 90

  - it: should harden the metrics exporter container by default
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      metrics.enabled: true
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true

  - it: should merge metrics exporter security context overrides onto the defaults
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      metrics.enabled: true
      metrics.exporter.securityContext:
        runAsUser: 65532
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532

  - it: should run as many pods as replica.replicas, the master included
    set:
      replica.enabled: true
      replica.replicas: 3
      persistence.enabled: true
      persistence.size: "5Gi"
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: should accept a master without replicas
    set:
      replica.enabled: true
      replica.replicas: 1
      persistence.enabled: true
      persistence.size: "5Gi"
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: should refuse zero Valkey pods
    set:
      replica.enabled: true
      replica.replicas: 0
      persistence.enabled: true
      persistence.size: "5Gi"
    template: templates/statefulset.yaml
    asserts:
      - failedTemplate: {}

  - it: should use fixed container names
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
      metrics.enabled: true
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: init
      - equal:
          path: spec.template.spec.containers[0].name
          value: valkey
      - equal:
          path: spec.template.spec.containers[1].name
          value: metrics

  - it: should label the Valkey pods and workload with the valkey component, outside the selector
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: valkey
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: valkey
      - notExists:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]

  - it: should keep the default StatefulSet name
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: "5Gi"
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-valkey

  # Sentinel still marks a restarted pod as down for several seconds after it
  # is ready; a failover in that window leaves it following the old master.
  - it: should hold a rolling update until Sentinel has caught up with a restarted pod
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: 1Gi
      sentinel.enabled: true
      sentinel.password: "pw"
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.minReadySeconds
          value: 15

  - it: should not delay rolling updates without Sentinel
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: 1Gi
    template: templates/statefulset.yaml
    asserts:
      - notExists:
          path: spec.minReadySeconds
