suite: metrics exporter connection settings
templates:
  - templates/deploy_valkey.yaml
  - templates/statefulset.yaml
  - templates/init_config.yaml
  - templates/secret.yaml
  - templates/metrics-svc.yaml
set:
  metrics.enabled: true
tests:
  # The exporter runs as a sidecar and reaches Valkey on localhost, so the same
  # settings apply to the standalone Deployment and the replicated StatefulSet.

  - it: should point the Deployment exporter at the local Valkey port
    set:
      service.port: 6380
    template: templates/deploy_valkey.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_ADDR
            value: redis://localhost:6380
      - notExists:
          path: spec.template.spec.containers[1].env[?(@.name == "REDIS_EXPORTER_TLS_CA_CERT_FILE")]
      - notExists:
          path: spec.template.spec.containers[1].volumeMounts

  - it: should point the StatefulSet exporter at the local Valkey port
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: 1Gi
      service.port: 6380
    template: templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_ADDR
            value: redis://localhost:6380
      - notExists:
          path: spec.template.spec.containers[1].env[?(@.name == "REDIS_EXPORTER_TLS_CA_CERT_FILE")]
      - notExists:
          path: spec.template.spec.containers[1].volumeMounts

  - it: should connect the Deployment exporter over TLS
    set:
      tls.enabled: true
      tls.existingSecret: valkey-tls
    template: templates/deploy_valkey.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_ADDR
            value: rediss://localhost:6379
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_EXPORTER_TLS_CA_CERT_FILE
            value: /tls/ca.crt
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_EXPORTER_TLS_SERVER_NAME
            value: RELEASE-NAME-valkey
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: RELEASE-NAME-valkey-tls
            mountPath: /tls

  - it: should connect the StatefulSet exporter over TLS
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: 1Gi
      tls.enabled: true
      tls.existingSecret: valkey-tls
    template: templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_ADDR
            value: rediss://localhost:6379
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_EXPORTER_TLS_CA_CERT_FILE
            value: /tls/ca.crt
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_EXPORTER_TLS_CLIENT_CERT_FILE
            value: /tls/server.crt
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_EXPORTER_TLS_CLIENT_KEY_FILE
            value: /tls/server.key
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_EXPORTER_TLS_SERVER_NAME
            value: RELEASE-NAME-valkey
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: RELEASE-NAME-valkey-tls
            mountPath: /tls

  - it: should use metrics.exporter.tlsServerName for certificate verification
    set:
      tls.enabled: true
      tls.existingSecret: valkey-tls
      metrics.exporter.tlsServerName: valkey.example.svc.cluster.local
    template: templates/deploy_valkey.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_EXPORTER_TLS_SERVER_NAME
            value: valkey.example.svc.cluster.local

  - it: should leave REDIS_ADDR to metrics.exporter.extraEnv instead of setting it twice
    set:
      metrics.exporter.extraEnv:
        - name: REDIS_ADDR
          value: redis://localhost:6390
    template: templates/deploy_valkey.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_ADDR
            value: redis://localhost:6390
      - notContains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_ADDR
            value: redis://localhost:6379

  - it: should take REDIS_PASSWORD from the default user's generated secret key
    set:
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          password: "supersecret"
    template: templates/deploy_valkey.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-valkey-auth
                key: default-password

  - it: should not point REDIS_PASSWORD at a missing key when auth.aclConfig defines the default user
    set:
      auth.enabled: true
      auth.aclConfig: "user default on >password ~* &* +@all"
    template: templates/deploy_valkey.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[1].env[?(@.name == "REDIS_PASSWORD")]

  - it: should leave REDIS_PASSWORD to metrics.exporter.extraEnv instead of setting it twice
    set:
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          password: "supersecret"
      metrics.exporter.extraEnv:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-exporter-secret
              key: password
    template: templates/deploy_valkey.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-valkey-auth
                key: default-password
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-exporter-secret
                key: password

  - it: should leave TLS settings to metrics.exporter.extraEnv instead of setting them twice
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: 1Gi
      tls.enabled: true
      tls.existingSecret: valkey-tls
      metrics.exporter.extraEnv:
        - name: REDIS_EXPORTER_TLS_CLIENT_CERT_FILE
          value: /client/tls.crt
    template: templates/statefulset.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_EXPORTER_TLS_CLIENT_CERT_FILE
            value: /client/tls.crt
      - notContains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_EXPORTER_TLS_CLIENT_CERT_FILE
            value: /tls/server.crt
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_EXPORTER_TLS_CA_CERT_FILE
            value: /tls/ca.crt

  # The 0.x workaround for an exporter without TLS files; the chart mounts
  # them now, and Kubernetes rejects two mounts on one path.
  - it: should refuse a /tls mount in metrics.exporter.extraVolumeMounts
    set:
      replica.enabled: true
      persistence.enabled: true
      persistence.size: 1Gi
      tls.enabled: true
      tls.existingSecret: valkey-tls
      metrics.exporter.extraVolumeMounts:
        - name: my-exporter-tls
          mountPath: /tls/
    template: templates/statefulset.yaml
    asserts:
      - failedTemplate:
          errorPattern: "metrics.exporter.extraVolumeMounts mounts /tls, which the chart uses for the TLS files.*See UPGRADE.md."

  - it: should keep its own /tls mount next to unrelated extraVolumeMounts
    set:
      tls.enabled: true
      tls.existingSecret: valkey-tls
      metrics.exporter.extraVolumeMounts:
        - name: other
          mountPath: /other
    template: templates/deploy_valkey.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers[1].volumeMounts
          count: 2
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: RELEASE-NAME-valkey-tls
            mountPath: /tls

  - it: should fail with a clear message when the exporter image tag is empty
    set:
      metrics.exporter.image.tag: ""
    template: templates/deploy_valkey.yaml
    asserts:
      - failedTemplate:
          errorPattern: "metrics.exporter.image.tag must not be empty"

  - it: should not require the exporter image tag when metrics are disabled
    set:
      metrics.enabled: false
      metrics.exporter.image.tag: ""
    template: templates/deploy_valkey.yaml
    asserts:
      - notFailedTemplate: {}

  # The metrics Service exposes the same parity fields as the other service
  # blocks: clusterIP, loadBalancerClass, loadBalancerSourceRanges and
  # nodePort render only when they apply.
  - it: should render the metrics Service port on the flat path
    template: templates/metrics-svc.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9121

  - it: should set nodePort on the metrics Service when type is NodePort
    set:
      metrics.service.type: NodePort
      metrics.service.nodePort: 30091
    template: templates/metrics-svc.yaml
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].nodePort
          value: 30091

  - it: should not set nodePort when the metrics Service type is ClusterIP
    set:
      metrics.service.nodePort: 30091
    template: templates/metrics-svc.yaml
    asserts:
      - notExists:
          path: spec.ports[0].nodePort

  - it: should restrict the metrics LoadBalancer to loadBalancerSourceRanges
    set:
      metrics.service.type: LoadBalancer
      metrics.service.loadBalancerSourceRanges:
        - 10.0.0.0/8
    template: templates/metrics-svc.yaml
    asserts:
      - equal:
          path: spec.type
          value: LoadBalancer
      - contains:
          path: spec.loadBalancerSourceRanges
          content: 10.0.0.0/8

  - it: should set clusterIP on the metrics Service when configured
    set:
      metrics.service.clusterIP: 10.96.0.42
    template: templates/metrics-svc.yaml
    asserts:
      - equal:
          path: spec.clusterIP
          value: 10.96.0.42

  - it: should set loadBalancerClass on the metrics Service when the type is LoadBalancer
    set:
      metrics.service.type: LoadBalancer
      metrics.service.loadBalancerClass: service.k8s.aws/nlb
    template: templates/metrics-svc.yaml
    asserts:
      - equal:
          path: spec.loadBalancerClass
          value: service.k8s.aws/nlb

  - it: should not render clusterIP, loadBalancerClass or sourceRanges by default
    template: templates/metrics-svc.yaml
    asserts:
      - notExists:
          path: spec.clusterIP
      - notExists:
          path: spec.loadBalancerClass
      - notExists:
          path: spec.loadBalancerSourceRanges

  # loadBalancerClass and loadBalancerSourceRanges are only valid on a
  # LoadBalancer Service, so they are not rendered when the type is not
  # LoadBalancer, even if set.
  - it: should not render loadBalancer fields when the type is not LoadBalancer
    set:
      metrics.service.loadBalancerClass: service.k8s.aws/nlb
      metrics.service.loadBalancerSourceRanges:
        - 10.0.0.0/8
    template: templates/metrics-svc.yaml
    asserts:
      - notExists:
          path: spec.loadBalancerClass
      - notExists:
          path: spec.loadBalancerSourceRanges
