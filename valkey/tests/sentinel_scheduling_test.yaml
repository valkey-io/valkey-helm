suite: sentinel scheduling and disruption budget
templates:
  - templates/statefulset.yaml
  - templates/sentinel-statefulset.yaml
  - templates/sentinel-pdb.yaml
  - templates/poddisruptionbudget.yaml
  - templates/init_config.yaml
  - templates/secret.yaml
  - templates/sentinel-configmap.yaml
set:
  replica.enabled: true
  replica.persistence.size: "5Gi"
  replica.sentinel.enabled: true
  replica.sentinel.password: "sentinelpw"
tests:
  - it: should not apply the Valkey affinity, spread constraints, pod labels or annotations to Sentinel
    set:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: valkey
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
      podLabels:
        valkey-only: "true"
      podAnnotations:
        valkey-only: "true"
    template: templates/sentinel-statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.spec.topologySpreadConstraints
      - notExists:
          path: spec.template.metadata.labels.valkey-only
      - notExists:
          path: spec.template.metadata.annotations.valkey-only

  - it: should render the Sentinel scheduling, labels and annotations
    set:
      replica.sentinel.podLabels:
        team: sentinel
      replica.sentinel.podAnnotations:
        note: sentinel
      replica.sentinel.nodeSelector:
        pool: sentinel
      replica.sentinel.tolerations:
        - key: sentinel
          operator: Exists
          effect: NoSchedule
      replica.sentinel.affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: sentinel
      replica.sentinel.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: sentinel
      nodeSelector:
        pool: valkey
      tolerations:
        - key: valkey
          operator: Exists
    template: templates/sentinel-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels.team
          value: sentinel
      - equal:
          path: spec.template.metadata.annotations.note
          value: sentinel
      - exists:
          path: spec.template.metadata.annotations["checksum/sentinelconfig"]
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            pool: sentinel
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: sentinel
              operator: Exists
              effect: NoSchedule
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.labelSelector.matchLabels
          value:
            app.kubernetes.io/component: sentinel
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].topologyKey
          value: kubernetes.io/hostname

  - it: should fall back to the top level nodeSelector and tolerations
    set:
      nodeSelector:
        pool: valkey
      tolerations:
        - key: valkey
          operator: Exists
    template: templates/sentinel-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            pool: valkey
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: valkey
              operator: Exists

  - it: should keep the Sentinel values off the Valkey pods
    set:
      replica.sentinel.podLabels:
        team: sentinel
      replica.sentinel.podAnnotations:
        note: sentinel
      replica.sentinel.nodeSelector:
        pool: sentinel
      replica.sentinel.tolerations:
        - key: sentinel
          operator: Exists
      replica.sentinel.affinity:
        podAntiAffinity: {}
      replica.sentinel.topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    template: templates/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.labels.team
      - notExists:
          path: spec.template.metadata.annotations.note
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.spec.topologySpreadConstraints

  - it: should not budget Sentinel disruptions unless asked to
    template: templates/sentinel-pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render the Sentinel budget without Sentinel
    set:
      replica.sentinel.enabled: false
      replica.sentinel.podDisruptionBudget.enabled: true
    template: templates/sentinel-pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render a Sentinel budget selecting only the Sentinel pods
    set:
      replica.sentinel.podDisruptionBudget.enabled: true
      replica.sentinel.podDisruptionBudget.unhealthyPodEvictionPolicy: AlwaysAllow
    template: templates/sentinel-pdb.yaml
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: RELEASE-NAME-valkey-sentinel
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: sentinel
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: valkey-sentinel
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: sentinel
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow

  - it: should match the Sentinel pod labels with the budget selector
    set:
      replica.sentinel.podDisruptionBudget.enabled: true
    template: templates/sentinel-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: valkey-sentinel
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: sentinel

  - it: should honour minAvailable of zero rather than falling back
    set:
      replica.sentinel.podDisruptionBudget.enabled: true
      replica.sentinel.podDisruptionBudget.minAvailable: 0
    template: templates/sentinel-pdb.yaml
    asserts:
      - equal:
          path: spec.minAvailable
          value: 0
      - notExists:
          path: spec.maxUnavailable

  - it: should honour maxUnavailable of zero
    set:
      replica.sentinel.podDisruptionBudget.enabled: true
      replica.sentinel.podDisruptionBudget.maxUnavailable: 0
    template: templates/sentinel-pdb.yaml
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 0

  - it: should fail on a Sentinel budget with neither minAvailable nor maxUnavailable
    set:
      replica.sentinel.podDisruptionBudget.enabled: true
      replica.sentinel.podDisruptionBudget.minAvailable: null
      replica.sentinel.podDisruptionBudget.maxUnavailable: null
    template: templates/statefulset.yaml
    asserts:
      - failedTemplate:
          errorPattern: "replica.sentinel.podDisruptionBudget needs either minAvailable or maxUnavailable.*"

  - it: should keep the Valkey budget off the Sentinel pods
    set:
      podDisruptionBudget.enabled: true
    template: templates/poddisruptionbudget.yaml
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: valkey
