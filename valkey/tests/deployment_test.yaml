suite: deployment configuration
templates:
  - templates/deploy_valkey.yaml
  - templates/init_config.yaml
tests:
  - it: should not have auth volumes when auth disabled
    set:
      auth.enabled: false
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.spec.volumes[?(@.name == "valkey-users-secret")]
      - notExists:
          path: spec.template.spec.volumes[?(@.name == "valkey-auth-secret")]
      - notExists:
          path: spec.template.spec.initContainers[0].volumeMounts[?(@.name == "valkey-users-secret")]
      - notExists:
          path: spec.template.spec.initContainers[0].volumeMounts[?(@.name == "valkey-auth-secret")]

  - it: should have generated volume with inline passwords
    set:
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          password: "default-password"
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: valkey-auth-secret
            secret:
              secretName: RELEASE-NAME-valkey-auth
              defaultMode: 0400
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: valkey-auth-secret
            mountPath: /valkey-auth-secret
            readOnly: true

  - it: should have users-secret volume with usersExistingSecret
    set:
      auth.enabled: true
      auth.usersExistingSecret: "my-custom-secret"
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: valkey-users-secret
            secret:
              secretName: my-custom-secret
              defaultMode: 0400
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: valkey-users-secret
            mountPath: /valkey-users-secret
            readOnly: true

  - it: should render users-secret volume with templated usersExistingSecret
    set:
      auth.enabled: true
      auth.usersExistingSecret: "my-custom-secret-{{ .Release.Name }}"
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: valkey-users-secret
            secret:
              secretName: my-custom-secret-RELEASE-NAME
              defaultMode: 0400

  - it: should have both volumes with mixed passwords
    set:
      auth.enabled: true
      auth.usersExistingSecret: "my-custom-secret"
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          password: "default-password"
        readonly:
          permissions: "~* +@read"
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: valkey-users-secret
            secret:
              secretName: my-custom-secret
              defaultMode: 0400
      - contains:
          path: spec.template.spec.volumes
          content:
            name: valkey-auth-secret
            secret:
              secretName: RELEASE-NAME-valkey-auth
              defaultMode: 0400

  - it: should have generated volume with aclConfig only
    set:
      auth.enabled: true
      auth.aclConfig: "user default on >password ~* &* +@all"
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: valkey-auth-secret
            secret:
              secretName: RELEASE-NAME-valkey-auth
              defaultMode: 0400

  - it: should use custom image
    set:
      image.registry: custom-registry
      image.repository: valkey/valkey
      image.tag: "7.0.0"
    template: templates/deploy_valkey.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: custom-registry/valkey/valkey:7.0.0

  - it: should have service account
    set:
      serviceAccount.create: true
      serviceAccount.name: "custom-sa"
    template: templates/deploy_valkey.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-sa

  - it: should use image pull policy for containers and initContainers
    set:
      image.pullPolicy: Always
    template: templates/deploy_valkey.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.initContainers[0].imagePullPolicy
          value: Always

  - it: should always have annotations block even without podAnnotations
    set:
      podAnnotations: null
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - exists:
          path: spec.template.metadata.annotations
      - exists:
          path: spec.template.metadata.annotations["checksum/initconfig"]

  - it: should include podAnnotations when provided
    set:
      podAnnotations:
        prometheus.io/scrape: "true"
        custom.annotation: "value"
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["custom.annotation"]
          value: value
      - exists:
          path: spec.template.metadata.annotations["checksum/initconfig"]

  - it: should use image pull policy for containers, initContainers and metrics
    set:
      image.pullPolicy: Always
      metrics.enabled: true
      metrics.exporter.image.pullPolicy: Always
    template: templates/deploy_valkey.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.initContainers[0].imagePullPolicy
          value: Always
      - equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: Always

  - it: should not have imagePullSecrets when not configured
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.spec.imagePullSecrets

  - it: should render imagePullSecrets from values.imagePullSecrets
    set:
      imagePullSecrets:
        - myregistrykey
        - anotherregistrykey
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: myregistrykey
            - name: anotherregistrykey

  - it: should render imagePullSecrets from global.imagePullSecrets
    set:
      global.imagePullSecrets:
        - globalregistrykey
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: globalregistrykey

  - it: should merge global and local imagePullSecrets
    set:
      global.imagePullSecrets:
        - globalregistrykey
      imagePullSecrets:
        - localregistrykey
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: globalregistrykey
            - name: localregistrykey
          
  - it: should include extra containers from overlay
    set:
      extraContainers:
        - name: nginx-sidecar
          image: registry.hub.docker.com/nginx/nginx:stable-alpine
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[1].name
          value: nginx-sidecar

  - it: should render extraVolumes
    set:
      extraVolumes:
        - name: extra-config
          configMap:
            name: my-config
        - name: extra-secret
          secret:
            secretName: my-secret
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-config
            configMap:
              name: my-config
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-secret
            secret:
              secretName: my-secret

  - it: should render extraVolumeMounts for main container
    set:
      extraVolumeMounts:
        - name: extra-config
          mountPath: /extra-config
          readOnly: true
        - name: extra-data
          mountPath: /extra/data
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-config
            mountPath: /extra-config
            readOnly: true
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-data
            mountPath: /extra/data

  - it: should render both extraVolumes and extraVolumeMounts together
    set:
      extraVolumes:
        - name: extra-config
          configMap:
            name: my-config
      extraVolumeMounts:
        - name: extra-config
          mountPath: /extra-config
          readOnly: true
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.volumes
          content:
            name: extra-config
            configMap:
              name: my-config
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: extra-config
            mountPath: /extra-config
            readOnly: true

  - it: should include workload annotations when provided
    set:
      workloadAnnotations:
        example.com/annotation: "test-value"
        custom.annotation: "custom-value"
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.annotations["example.com/annotation"]
          value: "test-value"
      - equal:
          path: metadata.annotations["custom.annotation"]
          value: "custom-value"

  - it: should not have REDIS_PASSWORD env in metrics exporter when auth is disabled
    set:
      auth.enabled: false
      metrics.enabled: true
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - notContains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_PASSWORD

  - it: should set REDIS_PASSWORD from generated secret in metrics exporter when auth is enabled
    set:
      auth.enabled: true
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          password: "default-password"
      metrics.enabled: true
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-valkey-auth
                key: default-password

  - it: should set REDIS_PASSWORD from existing secret in metrics exporter when usersExistingSecret is set
    set:
      auth.enabled: true
      auth.usersExistingSecret: "my-custom-secret"
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
      metrics.enabled: true
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-custom-secret
                key: default

  - it: should render templated usersExistingSecret in metrics exporter
    set:
      auth.enabled: true
      auth.usersExistingSecret: "my-custom-secret-{{ .Release.Name }}"
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
      metrics.enabled: true
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-custom-secret-RELEASE-NAME
                key: default

  - it: should set REDIS_PASSWORD using custom passwordKey in metrics exporter when usersExistingSecret is set
    set:
      auth.enabled: true
      auth.usersExistingSecret: "my-custom-secret"
      auth.aclUsers:
        default:
          permissions: "~* &* +@all"
          passwordKey: "my-password-key"
      metrics.enabled: true
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-custom-secret
                key: my-password-key

  - it: should not set runtimeClassName when empty
    set:
      runtimeClassName: ""
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.template.spec.runtimeClassName

  - it: should set runtimeClassName when provided
    set:
      runtimeClassName: "gvisor"
    template: templates/deploy_valkey.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.runtimeClassName
          value: "gvisor"
  # Regression test for #264: init.sh writes the config under /valkey-conf, so
  # the Deployment has to mount that volume in both containers and start the
  # server from the same path.
  - it: should start valkey-server from the config init.sh generates
    template: templates/deploy_valkey.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: [ "/valkey-conf/valkey.conf" ]
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: valkey-conf
            mountPath: /valkey-conf
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: valkey-conf
            mountPath: /valkey-conf
      - contains:
          path: spec.template.spec.volumes
          content:
            name: valkey-conf
            emptyDir:
              medium: Memory

  - it: should generate the config at the path the Deployment starts from
    template: templates/init_config.yaml
    asserts:
      - matchRegex:
          path: data["init.sh"]
          pattern: 'VALKEY_CONFIG=\$\{VALKEY_CONFIG_PATH:-/valkey-conf/valkey.conf\}'

  # The pod template is shared with the StatefulSet; this is the one mount
  # that is deliberately left to the Deployment.
  - it: should render extraVolumeMounts for the init container
    set:
      extraVolumeMounts:
        - name: extra-data
          mountPath: /extra/data
    template: templates/deploy_valkey.yaml
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: extra-data
            mountPath: /extra/data

  - it: should escape env values that contain quotes or backslashes
    set:
      env:
        QUOTED: 'say "hi"'
        WINDOWS_PATH: 'C:\path\n'
        NUMBER: 5
      metrics.enabled: true
      metrics.exporter.extraEnvs:
        EXPORTER_QUOTED: 'say "hi"'
    template: templates/deploy_valkey.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUOTED
            value: 'say "hi"'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: WINDOWS_PATH
            value: 'C:\path\n'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NUMBER
            value: "5"
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: EXPORTER_QUOTED
            value: 'say "hi"'
