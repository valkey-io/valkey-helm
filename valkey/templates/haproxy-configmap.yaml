{{- if .Values.haproxy.enabled }}
{{- $port := .Values.service.port }}
{{- $pods := int .Values.replica.replicas }}
{{- $checkUser := .Values.haproxy.checkUser | default "default" }}
{{- $sentinels := int .Values.sentinel.replicas }}
{{- /* A majority, so that two nodes can never both have it */}}
{{- $majority := add (div $sentinels 2) 1 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "valkey.fullname" . }}-haproxy
  labels:
    {{- include "valkey.haproxy.labels" . | nindent 4 }}
data:
  haproxy.cfg: |
    global
      log stdout format raw local0
      maxconn {{ .Values.haproxy.config.maxconn }}

    # Pod IPs change on every reschedule, so the backends are resolved at
    # runtime instead of once at startup.
    resolvers kubernetes
      parse-resolv-conf
      hold valid 1s
      hold nx 1s
      hold other 1s
      hold refused 1s
      hold timeout 1s

    defaults
      log global
      mode tcp
      option tcplog
      retries 3
      timeout connect {{ .Values.haproxy.config.timeout.connect }}
      timeout client {{ .Values.haproxy.config.timeout.client }}
      timeout server {{ .Values.haproxy.config.timeout.server }}
      # Pub/sub connections are idle by design. Without a tunnel timeout the
      # client and server timeouts above would drop every SUBSCRIBE.
      timeout tunnel {{ .Values.haproxy.config.timeout.tunnel }}
      option clitcpka
      option srvtcpka

    frontend valkey_write
      bind *:{{ .Values.haproxy.service.port }}
      default_backend valkey_master

    # Endpoint for the Kubernetes probes. HAProxy answers it itself, so the
    # probes never open a connection that gets proxied to a Valkey node. Probing
    # the proxy ports instead made every probe reach the master, which logged an
    # "Error accepting a client connection" for each one.
    frontend health
      bind *:{{ .Values.haproxy.config.healthPort }}
      mode http
      monitor-uri /healthz
      option dontlog-normal

    # A node receives traffic only while it answers "role:master" and a
    # majority of the Sentinels name it as the master. role:master alone is not
    # enough: after a failover the old master keeps answering it until Sentinel
    # demotes it, about ten seconds later, and every write it accepts in the
    # meantime is discarded when it resyncs from the new master.
    backend valkey_master
      # Every server has weight 0, so the load balancing algorithm never picks
      # one and only these rules route connections. A node also has to be the
      # only one with a majority: HAProxy polls each Sentinel separately, so
      # right after a failover a Sentinel can still count for the old master
      # while it already counts for the new one. When no node qualifies the
      # connection is closed rather than sent to a node that may be stale.
      {{- range $i := until $pods }}
      use-server {{ include "valkey.statefulsetName" $ }}-{{ $i }} if { srv_is_up(valkey_master/{{ include "valkey.statefulsetName" $ }}-{{ $i }}) } { nbsrv(sentinel_master_{{ $i }}) ge {{ $majority }} }
        {{- range $j := until $pods }}{{ if ne $i $j }} { nbsrv(sentinel_master_{{ $j }}) lt {{ $majority }} }{{ end }}{{ end }}
      {{- end }}
      option tcp-check
      # This rule opens the check connection, so ssl here is what encrypts it and
      # check-ssl or check-sni on a server line would be silently ignored. An sni
      # would have to be set here too, where it is one value for the whole
      # backend rather than the pod name each certificate carries. Valkey serves
      # a single certificate and does not select one by SNI, so the check sends
      # none and verifyhost validates the certificate it gets back.
      tcp-check connect port {{ $port }}{{ if .Values.tls.enabled }} ssl{{ end }}
      {{- if .Values.auth.enabled }}
      tcp-check send AUTH\ {{ $checkUser }}\ "${VALKEY_CHECK_PASSWORD}"\r\n
      tcp-check expect string +OK
      {{- end }}
      # QUIT is sent before the expect so that the node closes the connection as
      # soon as it has answered. Without it a replica would only fail the check
      # once "timeout check" expires, and would keep receiving writes until then.
      tcp-check send info\ replication\r\n
      tcp-check send QUIT\r\n
      tcp-check expect string role:master
      # Drain the QUIT reply so the node closes the connection first. Without
      # this HAProxy hangs up mid-stream on every successful check and the node
      # logs an "Error accepting a client connection" each time.
      tcp-check expect string +OK
      timeout check {{ .Values.haproxy.config.checkTimeout }}
      # init-state down keeps a node out of rotation until a check has proven it
      # is the master, otherwise a starting HAProxy would forward writes to a
      # replica during the first few seconds. fall 1 takes a demoted master out
      # immediately, and shutdown-sessions drops its connections so that clients
      # reconnect to the new master instead of holding a read-only one.
      default-server weight 0 check inter {{ .Values.haproxy.config.checkInterval }} fall 1 rise 1 init-addr last,libc,none init-state down resolvers kubernetes on-marked-down shutdown-sessions{{ include "valkey.haproxy.serverTlsOptions" . }}
      {{- range $i := until $pods }}
      server {{ include "valkey.statefulsetName" $ }}-{{ $i }} {{ include "valkey.statefulsetName" $ }}-{{ $i }}.{{ include "valkey.headlessServiceName" $ }}.{{ $.Release.Namespace }}.svc.{{ $.Values.clusterDomain }}:{{ $port }}{{ include "valkey.haproxy.serverTlsIdentityOptions" (dict "root" $ "index" $i) }}
      {{- end }}
    {{- range $i := until $pods }}
    {{- $node := printf "%s-%d.%s.%s.svc.%s" (include "valkey.statefulsetName" $) $i (include "valkey.headlessServiceName" $) $.Release.Namespace $.Values.clusterDomain }}

    # Up while a Sentinel names {{ include "valkey.statefulsetName" $ }}-{{ $i }} as the master, one server per Sentinel.
    backend sentinel_master_{{ $i }}
      option tcp-check
      tcp-check connect{{ if $.Values.tls.enabled }} ssl{{ end }}
      tcp-check send AUTH\ sentinel\ "${SENTINEL_CHECK_PASSWORD}"\r\n
      tcp-check expect string +OK
      tcp-check send SENTINEL\ get-master-addr-by-name\ {{ $.Values.sentinel.masterSet }}\r\n
      # Sentinel has no QUIT and keeps the connection open, and an expect that
      # does not match waits for more data until "timeout check". So first wait
      # for the whole reply: the port line, an empty reply or an error. Then
      # min-recv makes a different host a final answer instead of a timeout.
      tcp-check expect rstring (\r\n[0-9]+\r\n|[*]-1\r\n|\r\n-)
      tcp-check expect min-recv 1 string {{ $node }}\r\n
      timeout check {{ $.Values.haproxy.config.checkTimeout }}
      default-server check inter {{ $.Values.haproxy.config.checkInterval }} fall 1 rise 1 init-addr last,libc,none init-state down resolvers kubernetes{{ include "valkey.haproxy.sentinelTlsOptions" $ }}
      {{- range $j := until $sentinels }}
      {{- $sentinel := printf "%s-%d.%s.%s.svc.%s" (include "valkey.sentinel.fullname" $) $j (include "valkey.sentinel.headlessServiceName" $) $.Release.Namespace $.Values.clusterDomain }}
      server {{ include "valkey.sentinel.fullname" $ }}-{{ $j }} {{ $sentinel }}:{{ $.Values.sentinel.port }}{{ if and $.Values.tls.enabled (eq $.Values.haproxy.tls.verify "required") }} verifyhost {{ $sentinel }}{{ end }}
      {{- end }}
    {{- end }}
{{- end }}
