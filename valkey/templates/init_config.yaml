{{- $pods := int .Values.replica.replicas }}
{{- $initMonitorUser := .Values.sentinel.monitorUser | default .Values.replica.replicationUser }}
{{- $initMonitorKey := $initMonitorUser }}
{{- if and .Values.auth.enabled (hasKey .Values.auth.aclUsers $initMonitorUser) }}
{{- $initMonitorKey = (index .Values.auth.aclUsers $initMonitorUser).passwordKey | default $initMonitorUser }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "valkey.fullname" . }}-init-scripts
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
data:
{{- if and .Values.replica.enabled .Values.sentinel.enabled }}
  valkey-start.sh: |-
    #!/bin/sh
    # Starts the server, and keeps the credential free record of the current
    # master fresh while it runs.
    #
    # Sentinel persists a promotion by making the server rewrite its config, and
    # that config is on a memory backed volume, so nothing on disk would show a
    # failover that happened after this pod started. An abrupt restart would
    # then come back with the pre-failover topology and could hand writes to a
    # node that had already been demoted. Mirroring the replicaof line onto the
    # data volume keeps the record at most one interval behind a role change.
    #
    # It reads the config Valkey maintains rather than asking the server, so it
    # needs no credentials and no TLS material. Valkey rewrites that file by
    # writing a temporary file and renaming it over the old one, so a read
    # always sees a complete config, either the old or the new.
    #
    # Valkey rewrites the config at the moment Sentinel changes this pod's role,
    # so the loop below runs once a second by default to keep the record close
    # to the promotion that it describes. Everything it does on a tick where
    # nothing changed is a shell builtin, so the only process it starts per tick
    # is the sleep itself.
    set -eu

    # Prints this pod's StatefulSet ordinal. It comes from the
    # apps.kubernetes.io/pod-index label (POD_INDEX), which Kubernetes only
    # sets from 1.28; before that the variable is empty. Assuming 0 would make
    # every pod take itself for pod-0, the master, so fall back to the pod
    # name (POD_NAME, from metadata.name), which for a StatefulSet pod ends in
    # the ordinal, and fail when neither gives a number.
    pod_index() {
      index="${POD_INDEX:-}"
      if [ -z "$index" ]; then
        pod_name="${POD_NAME:-}"
        index="${pod_name##*-}"
      fi
      case "$index" in
        ""|*[!0-9]*)
          echo "$(date) ERROR: cannot tell this pod's StatefulSet ordinal from the pod-index label ('${POD_INDEX:-}') or the pod name ('${POD_NAME:-}')" >&2
          return 1
          ;;
      esac
      printf '%s\n' "$index"
    }

    CONF="${VALKEY_CONFIG_PATH:-/valkey-conf/valkey.conf}"
    MARKER="/data/conf/last-master"
    POD_INDEX=$(pod_index) || exit 1
    SELF="{{ include "valkey.statefulsetName" . }}-${POD_INDEX}.{{ include "valkey.headlessServiceName" . }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}"

    track_master() {
      # Word splitting is what parses each config line, so keep globbing off:
      # an unrelated directive holding a * must not expand against the cwd.
      set -f
      cfg_line=""
      write_failed=""
      while :; do
        sleep {{ .Values.sentinel.masterRecordRefreshSeconds }}
        [ -f "$CONF" ] || continue
        # No replicaof line means this pod is the master.
        host="$SELF"
        port="{{ .Values.service.port }}"
        # Valkey ends every line of the config it writes with a newline, so
        # read, which skips a final line that lacks one, sees all of them.
        while IFS= read -r cfg_line; do
          # The trailing "" keeps $1 defined for blank and whitespace only lines.
          set -- $cfg_line ""
          case "$1" in
            replicaof|slaveof)
              if [ "${2:-}" = "no" ] && [ "${3:-}" = "one" ]; then
                # Valkey spells "this node is a master" as "replicaof no one".
                host="$SELF"
                port="{{ .Values.service.port }}"
              else
                host="${2:-}"
                port="${3:-}"
              fi
              ;;
          esac
        done < "$CONF"
        case "$port" in
          ""|*[!0-9]*) continue ;;
        esac
        [ -n "$host" ] || continue
        current=""
        if [ -f "$MARKER" ]; then
          IFS= read -r current < "$MARKER" || current=""
        fi
        if [ "$current" != "$host $port" ]; then
          # Write and rename, so that a cold start can never read half a record,
          # and say so when it fails. A record that cannot be updated keeps
          # naming this pod after it has been demoted, and that is what a cold
          # start would come back on. The next tick retries, because the record
          # still does not match, so one complaint per outage is enough.
          if mkdir -p /data/conf 2>/dev/null &&
             printf '%s %s\n' "$host" "$port" > "$MARKER.tmp" 2>/dev/null &&
             mv "$MARKER.tmp" "$MARKER" 2>/dev/null; then
            write_failed=""
          elif [ -z "$write_failed" ]; then
            write_failed="yes"
            echo "$(date) ERROR: cannot record the master as $host $port in $MARKER, a cold start would fall back on the last record written" >&2
          fi
        fi
      done
    }

    # Before anything else, make sure a restarted master does not come back
    # writable with an older dataset than its replicas hold.
    SELF="$SELF" CONF="$CONF" MARKER="$MARKER" /scripts/master-restart-guard.sh ||
      echo "$(date) ERROR: the master restart check failed, starting as configured" >&2

    track_master &
    exec valkey-server "$@"

  master-restart-guard.sh: |-
    #!/bin/sh
    # Run by valkey-start.sh before the server starts, with SELF, CONF and
    # MARKER set. Kept apart from it because it needs the Sentinel credential,
    # which valkey-start.sh, running for the life of the pod, does without.
    set -eu

    # Every Sentinel by its own name. The headless service also lists a Sentinel
    # that is down but not deleted, and a client only tries the first address.
    SENTINELS="{{ range $i := until (int .Values.sentinel.replicas) }}{{ include "valkey.sentinel.fullname" $ }}-{{ $i }}.{{ include "valkey.sentinel.headlessServiceName" $ }}.{{ $.Release.Namespace }}.svc.{{ $.Values.clusterDomain }} {{ end }}"

    # Fails when the Sentinel cannot be reached. An error reply still succeeds,
    # so callers check what came back. -t bounds only the connect, so timeout
    # bounds the whole call: a Sentinel that accepts and never answers would
    # otherwise hold the guard, and the pod, forever.
    sentinel_cli() {
      peer="$1"
      shift
      sentinel_password=$(cat /sentinel-auth/password 2>/dev/null) || return 1
      out=$(REDISCLI_AUTH="$sentinel_password" timeout 5 valkey-cli {{ include "valkey.sentinel.cliTlsFlags" . }} --user sentinel \
        -t 2 -h "$peer" -p {{ .Values.sentinel.port }} --raw "$@" 2>/dev/null) || return 1
      printf '%s\n' "$out" | tr -d '\r'
    }

    # Prints "host port healthy" from the first Sentinel that answers: the
    # master it names, and how many replicas it holds as healthy, flagged as
    # nothing but "slave", or "slave,promoted" for the one it is promoting
    # right now. Fails when no Sentinel gives a complete answer.
    sentinel_view() {
      for peer in $SENTINELS; do
        addr=$(sentinel_cli "$peer" sentinel get-master-addr-by-name {{ .Values.sentinel.masterSet }}) || continue
        host=$(echo "$addr" | sed -n 1p)
        port=$(echo "$addr" | sed -n 2p)
        [ -n "$host" ] && echo "$port" | grep -qE "^[0-9]+$" || continue
        replicas=$(sentinel_cli "$peer" sentinel replicas {{ .Values.sentinel.masterSet }}) || continue
        # --raw prints each replica's fields as name and value lines, starting
        # with "name"; no replicas print nothing, and anything else is an error.
        case "$(echo "$replicas" | sed -n 1p)" in
          ""|name) ;;
          *) continue ;;
        esac
        healthy=$(echo "$replicas" | awk 'prev == "flags" && ($0 == "slave" || $0 == "slave,promoted") { n++ } { prev = $0 } END { print n + 0 }')
        printf '%s %s %s\n' "$host" "$port" "$healthy"
        return 0
      done
      return 1
    }

    # Joins the master Sentinel names, before the server starts.
    follow() {
      echo "$(date) Sentinel names ${1% *} as the master, starting as its replica" >&2
      sed -i -E '/^(replicaof|slaveof) /d' "$CONF"
      printf 'replicaof %s %s\n' "${1% *}" "${1#* }" >> "$CONF"
      mkdir -p /data/conf
      printf '%s\n' "$1" > "$MARKER.tmp" && mv "$MARKER.tmp" "$MARKER"
    }

    # A server that starts as the master comes back with the dataset of its
    # last save, and the replicas then resynchronise from it and drop every
    # write they had since. That is what a restart of the master looks like
    # when it is back before Sentinel's downAfterMilliseconds: Sentinel only
    # sees a reboot and keeps it as the master. The replicas Sentinel still
    # holds as healthy were following this server until it went down, so they
    # are at least as recent as anything on disk here. Stay down instead, so
    # that Sentinel promotes one of them, and come back as its replica.
    # Init containers do not run again when only this container restarts, so
    # the check has to be here rather than in init.sh.
    #
    # A container that restarts after Sentinel already promoted another node
    # also comes back without a replicaof line, so follow whichever master
    # Sentinel names that is not this pod. When no Sentinel answers at all,
    # e.g. on a cold start where they restart too, start as configured.
    #
    # The startup probe can restart this container while it waits. The wait
    # started is kept on the config volume, which survives that restart but
    # not the pod, so that the fallback still comes after
    # restartFailoverWaitSeconds instead of the wait starting over each time.
    if ! grep -qE '^(replicaof|slaveof) ' "$CONF" || grep -qE '^(replicaof|slaveof) no one' "$CONF"; then
      SINCE_FILE="$(dirname "$CONF")/restart-guard-since"
      # The file goes once the guard is done, so a file left behind means the
      # container was restarted while it waited, and the wait carries on.
      WAITING=""
      [ -f "$SINCE_FILE" ] && WAITING="yes"
      if ! IFS= read -r SINCE < "$SINCE_FILE" 2>/dev/null || ! echo "$SINCE" | grep -qE '^[0-9]+$'; then
        SINCE=$(date +%s)
        printf '%s\n' "$SINCE" > "$SINCE_FILE"
      fi
      while :; do
        if VIEW=$(sentinel_view); then
          set -- $VIEW
          if [ "$1" != "$SELF" ]; then
            # Drop the wait before the replicaof line goes in: a container
            # stopped in between must not leave a deadline for a later wait.
            rm -f "$SINCE_FILE"
            follow "$1 $2"
            break
          fi
          # No healthy replica means nothing to wait for. Once waiting, only a
          # promotion or the deadline ends it: a replica that drops out for a
          # moment, or is flagged promoted mid-failover, should not start this
          # pod with the dataset on disk.
          if [ "$3" -eq 0 ] && [ -z "$WAITING" ]; then
            break
          fi
          if [ -z "$WAITING" ]; then
            WAITING="yes"
            echo "$(date) Sentinel still names this pod as the master and holds healthy replicas; waiting for it to promote one of them instead of starting with the dataset on disk" >&2
          fi
        elif [ -z "$WAITING" ]; then
          break
        fi
        if [ $(( $(date +%s) - SINCE )) -ge {{ .Values.sentinel.restartFailoverWaitSeconds }} ]; then
          echo "$(date) WARNING: Sentinel promoted no replica within {{ .Values.sentinel.restartFailoverWaitSeconds }}s, starting as configured with the dataset on disk" >&2
          break
        fi
        sleep 2
      done
      rm -f "$SINCE_FILE"
    fi
{{- end }}

  init.sh: |-
    #!/bin/sh
    set -eu

    # Default config paths
    # The config lives on a memory backed emptyDir, not on the data volume: it
    # carries the replication credentials in plain text, and CONFIG REWRITE puts
    # them back on every failover even if this script never wrote them, so the
    # file itself has to stay off persistent storage.
    VALKEY_CONFIG=${VALKEY_CONFIG_PATH:-/valkey-conf/valkey.conf}
    # The config is assembled in a temporary file and moved into place at the
    # very end, so that an interrupted run can never leave a half written config
    # behind. The restart logic below reads the previous config to decide the
    # replication role, and a truncated file would make it read the wrong one.
    VALKEY_CONFIG_TMP="${VALKEY_CONFIG}.tmp"

    LOGFILE="/data/init.log"
    {{- if and .Values.replica.enabled .Values.sentinel.enabled }}
    # Credential free record of the master this pod last followed. It is the
    # only durable topology left once the config moved to a memory backed
    # volume, and it is what breaks the cold start deadlock below.
    MASTER_MARKER="/data/conf/last-master"
    {{- end }}
    DATA_DIR="$(dirname "$VALKEY_CONFIG")"

    # Logging function (outputs to stderr and file)
    log() {
      echo "$(date) $1" | tee -a "$LOGFILE" >&2
    }

    {{- if .Values.auth.enabled }}
    # Function to get password for a user
    # Usage: get_user_password <username> [password_key]
    # Returns: password via stdout, exits with error if not found
    get_user_password() {
      username="$1"
      password_key="${2:-$username}"
      password=""

      {{- if .Values.auth.usersExistingSecret }}
      # Try to get password from existing secret first (priority)
      if [ -f "/valkey-users-secret/$password_key" ]; then
        password=$(cat "/valkey-users-secret/$password_key")
        log "Using password from existing secret for user $username"
      elif [ -f "/valkey-auth-secret/${username}-password" ]; then
        # Fallback to inline password
        password=$(cat "/valkey-auth-secret/${username}-password")
        log "Using inline password for user $username"
      else
        log "ERROR: No password found for user $username"
        return 1
      fi
      {{- else }}
      # Use inline password only
      if [ -f "/valkey-auth-secret/${username}-password" ]; then
        password=$(cat "/valkey-auth-secret/${username}-password")
        log "Using inline password for user $username"
      else
        log "ERROR: No password found for user $username"
        return 1
      fi
      {{- end }}

      # An empty value in the secret would otherwise be hashed into the ACL,
      # and the hash of an empty password is the same everywhere, so the user
      # would be open to anyone who can reach the port.
      if [ -z "$password" ]; then
        log "ERROR: The password for user $username is empty"
        return 1
      fi

      printf '%s' "$password"
    }

    escape_config_arg() {
      printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
    }
    {{- end }}

    # Clean old log if requested
    if [ "${KEEP_OLD_LOGS:-false}" != "true" ]; then
      rm -f "$LOGFILE"
    fi

    if [ -f "$LOGFILE" ]; then
      log "Detected restart of this instance ($HOSTNAME)"
    fi

    log "Creating configuration in $DATA_DIR..."
    mkdir -p "$DATA_DIR"
    rm -f "$VALKEY_CONFIG_TMP"


    # Base valkey.conf
    log "Generating base valkey.conf"
    {
{{- if .Values.tls.enabled }}
      echo "tls-cert-file /tls/{{ .Values.tls.serverPublicKey }}"
      echo "tls-key-file /tls/{{ .Values.tls.serverKey }}"
      echo "tls-ca-cert-file /tls/{{ .Values.tls.caPublicKey }}"
      {{- if .Values.tls.dhParamKey }}
      echo "tls-dh-params-file /tls/{{ .Values.tls.dhParamKey }}"
      {{- end }}
      {{- if not .Values.tls.requireClientCertificate }}
      echo "tls-auth-clients no"
      {{- end }}
      echo "port 0"
      echo "tls-port {{ .Values.service.port }}"
{{- else }}
      echo "port {{ .Values.service.port }}"
{{- end }}
      echo "protected-mode no"
      echo "bind * -::*"
      echo "dir /data"
      echo "loglevel {{ .Values.valkeyLogLevel }}"
    } >>"$VALKEY_CONFIG_TMP"

    {{- if .Values.auth.enabled }}
    # The ACL file sits next to valkey.conf, on the same memory backed volume.
    # It only holds password hashes, but it is still kept to its owner.
    # File modes cannot keep Valkey from rewriting it (ACL SAVE replaces the
    # file through a rename in this writable directory): restricting that is
    # left to the ACL permissions of the users.
    ACL_FILE="$(dirname "$VALKEY_CONFIG")/users.acl"
    echo "aclfile $ACL_FILE" >>"$VALKEY_CONFIG_TMP"

    # A rerun of this init container in the same pod finds the previous file
    log "Preparing ACL file at $ACL_FILE"
    rm -f "$ACL_FILE"
    (umask 077 && : >"$ACL_FILE")

    {{- if .Values.auth.aclUsers }}
    # Generate ACL entries for each user
    log "Generating ACL entries for users"
    {{- range $username, $user := .Values.auth.aclUsers }}
    {{- $passwordKey := $user.passwordKey | default $username }}

    # User: {{ $username }}
    PASSWORD=$(get_user_password "{{ $username }}" "{{ $passwordKey }}") || exit 1

    # Hash the password and write ACL entry
    PASSHASH=$(printf '%s' "$PASSWORD" | sha256sum | cut -f 1 -d " ")
    printf '%s\n' "user {{ $username }} on #$PASSHASH {{ $user.permissions }}" >> "$ACL_FILE"

    {{- end }}
    {{- end }}

    {{- if .Values.auth.aclConfig }}
    # Append inline ACL configuration
    log "Appending custom ACL configuration"
    if [ -f /valkey-auth-secret/aclConfig ]; then
      cat /valkey-auth-secret/aclConfig >> "$ACL_FILE"
    fi
    {{- end }}

    log "ACL file created"
    {{- end }}

    {{- if .Values.replica.enabled }}
    # Replica mode configuration
    log "Configuring replication mode"

    # Prints this pod's StatefulSet ordinal. It comes from the
    # apps.kubernetes.io/pod-index label (POD_INDEX), which Kubernetes only
    # sets from 1.28; before that the variable is empty. Assuming 0 would make
    # every pod take itself for pod-0, the master, so fall back to the pod
    # name (POD_NAME, from metadata.name), which for a StatefulSet pod ends in
    # the ordinal, and fail when neither gives a number.
    pod_index() {
      index="${POD_INDEX:-}"
      if [ -z "$index" ]; then
        pod_name="${POD_NAME:-}"
        index="${pod_name##*-}"
      fi
      case "$index" in
        ""|*[!0-9]*)
          echo "$(date) ERROR: cannot tell this pod's StatefulSet ordinal from the pod-index label ('${POD_INDEX:-}') or the pod name ('${POD_NAME:-}')" >&2
          return 1
          ;;
      esac
      printf '%s\n' "$index"
    }

    POD_INDEX=$(pod_index) || exit 1
    MASTER_HOST="{{ include "valkey.statefulsetName" . }}-0.{{ include "valkey.headlessServiceName" . }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}"
    MASTER_PORT="{{ .Values.service.port }}"

    # Every pod announces a stable hostname so that peers (and Sentinel) address
    # it by DNS name instead of a pod IP that changes on every reschedule.
    {
      echo ""
      echo "# Replication announce configuration"
      echo "replica-announce-ip {{ include "valkey.statefulsetName" . }}-$POD_INDEX.{{ include "valkey.headlessServiceName" . }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}"
      echo "replica-announce-port {{ .Values.service.port }}"
    } >>"$VALKEY_CONFIG_TMP"

    {{- if .Values.sentinel.enabled }}
    SELF_HOST="{{ include "valkey.statefulsetName" . }}-$POD_INDEX.{{ include "valkey.headlessServiceName" . }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}"

    # Ask the Sentinels that are already running which node is the master.
    # Without this, a pod that lost its volume would fall back to the pod index
    # and pod-0 would come back as a second writable master after a failover.
    # Every valkey-cli call here runs under timeout: -t bounds only the
    # connect, and a peer that accepts and never answers would otherwise hold
    # this init container, which no probe restarts, forever.
    master_from_sentinels() {
      sentinel_password=$(cat /sentinel-auth/password 2>/dev/null) || return 1
      peer="{{ include "valkey.sentinel.headlessServiceName" . }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}"
      addr=$(REDISCLI_AUTH="$sentinel_password" timeout 5 valkey-cli {{ include "valkey.sentinel.cliTlsFlags" . }} --user sentinel \
        -t 2 -h "$peer" -p {{ .Values.sentinel.port }} \
        sentinel get-master-addr-by-name {{ .Values.sentinel.masterSet }} 2>/dev/null || true)
      host=$(echo "$addr" | sed -n 1p)
      port=$(echo "$addr" | sed -n 2p)
      # Reject anything that is not a complete host/port pair, an error reply
      # would otherwise be turned into a bogus replication target.
      [ -n "$host" ] && echo "$port" | grep -qE "^[0-9]+$" || return 1
      printf '%s %s\n' "$host" "$port"
    }

    # Ask the Valkey nodes that are already running which of them is the master.
    # A node that answers is better evidence than a record written before this
    # pod went away: a pod that was down across a failover still has its own
    # name in that record, and coming back writable next to the node that was
    # promoted leaves two masters, which nothing can reconcile afterwards.
    master_from_running_nodes() {
      {{- if .Values.auth.enabled }}
      # As the user Sentinel itself monitors with, not the replication user:
      # the documented minimum for a replication user is +psync +replconf
      # +ping, which cannot run INFO, while the monitor user already has to be
      # allowed INFO for Sentinel to work at all.
      monitor_password=$(get_user_password "{{ $initMonitorUser }}" "{{ $initMonitorKey }}") || return 1
      {{- end }}
      i=0
      while [ "$i" -lt "{{ $pods }}" ]; do
        node="{{ include "valkey.statefulsetName" . }}-${i}.{{ include "valkey.headlessServiceName" . }}.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}"
        i=$((i + 1))
        if [ "$node" = "$SELF_HOST" ]; then
          continue
        fi
        {{- if .Values.auth.enabled }}
        info=$(REDISCLI_AUTH="$monitor_password" timeout 5 valkey-cli {{ include "valkey.sentinel.cliTlsFlags" . }} --user "{{ $initMonitorUser }}" \
          -t 2 -h "$node" -p {{ .Values.service.port }} info replication 2>/dev/null | tr -d '\r' || true)
        case "$info" in
          # valkey-cli prints the refusal and still exits 0, so without this the
          # node would look like it is simply not the master.
          *NOPERM*)
            log "ERROR: {{ $initMonitorUser }} may not run INFO on $node, so this pod cannot tell which node is the master"
            return 1
            ;;
        esac
        {{- else }}
        info=$(timeout 5 valkey-cli {{ include "valkey.sentinel.cliTlsFlags" . }} \
          -t 2 -h "$node" -p {{ .Values.service.port }} info replication 2>/dev/null | tr -d '\r' || true)
        {{- end }}
        if [ "$(echo "$info" | sed -n 's/^role://p')" = "master" ]; then
          printf '%s %s\n' "$node" "{{ .Values.service.port }}"
          return 0
        fi
      done
      return 1
    }
    {{- end }}

    # Determine the replication target for this pod.
    REPLICATION_TARGET=""
    {{- if .Values.sentinel.enabled }}
    # Persisted topology may be stale if this pod was offline during failover,
    # so prefer the current master reported by Sentinel.
    DISCOVERED=$(master_from_sentinels || true)
    if [ -n "$DISCOVERED" ]; then
      FOUND_HOST=${DISCOVERED% *}
      FOUND_PORT=${DISCOVERED#* }
      if [ "$FOUND_HOST" = "$SELF_HOST" ]; then
        log "Sentinel reports this pod as the master, starting as MASTER"
      else
        log "Sentinel reports $FOUND_HOST:$FOUND_PORT as the master, starting as REPLICA"
        REPLICATION_TARGET="replicaof $FOUND_HOST $FOUND_PORT"
      fi
    else
      # Nothing answered. On a whole cluster cold start every Sentinel is also
      # starting, and a Sentinel cannot name a master until a Valkey node is
      # up, so waiting for one here deadlocks until Sentinel gives up and
      # assumes pod-0, which discards the writes of the node that really was
      # the master. Come up in the last role recorded on the data volume
      # instead: the Sentinels are still scanning and will find the master.
      # A node that is already up outranks the record, whichever way the record
      # points: it settles a stale record that names this pod, and it avoids
      # attaching to a node that has itself been demoted since.
      RUNNING=$(master_from_running_nodes || true)
      if [ -n "$RUNNING" ]; then
        RUNNING_HOST=${RUNNING%% *}
        RUNNING_PORT=${RUNNING##* }
        log "No Sentinel answered, but $RUNNING_HOST:$RUNNING_PORT is already up as the master, starting as REPLICA"
        REPLICATION_TARGET="replicaof $RUNNING_HOST $RUNNING_PORT"
      else
      MARKED=""
      if [ -f "$MASTER_MARKER" ]; then
        # read fails on a line with no closing newline, which is what a record
        # interrupted mid write looks like. Taking it would mean replicating
        # from a truncated port such as "6", which no node is listening on.
        IFS= read -r MARKED < "$MASTER_MARKER" || MARKED=""
        MARKED=$(printf '%s' "$MARKED" | tr -d '\r')
      fi
      MARKED_HOST=${MARKED%% *}
      MARKED_PORT=${MARKED##* }
      if [ -n "$MARKED_HOST" ] && [ "$MARKED_HOST" != "$MARKED_PORT" ] &&
         echo "$MARKED_PORT" | grep -qE "^[0-9]+$" &&
         [ "$MARKED_PORT" -ge 1 ] && [ "$MARKED_PORT" -le 65535 ]; then
        if [ "$MARKED_HOST" = "$SELF_HOST" ]; then
          log "No Sentinel answered; last recorded master is this pod, starting as MASTER"
        else
          log "No Sentinel answered; last recorded master is $MARKED_HOST:$MARKED_PORT, starting as REPLICA"
          REPLICATION_TARGET="replicaof $MARKED_HOST $MARKED_PORT"
        fi
      else
        # Nothing anywhere: a fresh install, or a pod that lost its volume. The
        # Sentinels are still running their own discovery and bootstrap a master
        # once sentinel.startupTimeoutSeconds expires, and this pod only
        # has to be around to be told. Exiting here instead leaves the init
        # container crash looping until a retry happens to land after that, so
        # wait for the answer rather than for the next backoff.
        WAITED=0
        while [ "$WAITED" -lt "{{ .Values.sentinel.initialTopologyWaitSeconds }}" ]; do
          sleep 5
          WAITED=$((WAITED + 5))
          DISCOVERED=$(master_from_sentinels || true)
          if [ -z "$DISCOVERED" ]; then
            DISCOVERED=$(master_from_running_nodes || true)
          fi
          if [ -n "$DISCOVERED" ]; then
            break
          fi
          log "Waiting for a Sentinel or a running node to report the topology, ${WAITED}s of {{ .Values.sentinel.initialTopologyWaitSeconds }}s"
        done
        if [ -z "$DISCOVERED" ]; then
          log "No Sentinel answered and no recorded topology; refusing to start without a confirmed replication role"
          exit 1
        fi
        FOUND_HOST=${DISCOVERED% *}
        FOUND_PORT=${DISCOVERED#* }
        if [ "$FOUND_HOST" = "$SELF_HOST" ]; then
          log "Sentinel reports this pod as the master, starting as MASTER"
        else
          log "Sentinel reports $FOUND_HOST:$FOUND_PORT as the master, starting as REPLICA"
          REPLICATION_TARGET="replicaof $FOUND_HOST $FOUND_PORT"
        fi
      fi
      fi
    fi

    # Record the master this pod is about to follow. Host and port only, never
    # a credential, so it is safe to keep on the data volume.
    mkdir -p "$(dirname "$MASTER_MARKER")"
    if [ -n "$REPLICATION_TARGET" ]; then
      MARKER_HOST=$(echo "$REPLICATION_TARGET" | awk '{print $2}')
      MARKER_PORT=$(echo "$REPLICATION_TARGET" | awk '{print $3}')
    else
      MARKER_HOST="$SELF_HOST"
      MARKER_PORT="$MASTER_PORT"
    fi
    # Written under a temporary name and renamed, so that a pod killed here
    # leaves the previous record rather than an empty or half written one.
    printf '%s %s\n' "$MARKER_HOST" "$MARKER_PORT" > "$MASTER_MARKER.tmp"
    mv "$MASTER_MARKER.tmp" "$MASTER_MARKER"
    {{- else }}
    if [ "$POD_INDEX" = "0" ]; then
      log "This pod (index $POD_INDEX) is configured as MASTER"
    else
      log "This pod (index $POD_INDEX) is configured as REPLICA of $MASTER_HOST:$MASTER_PORT"
      REPLICATION_TARGET="replicaof $MASTER_HOST $MASTER_PORT"
    fi
    {{- end }}

    if [ -n "$REPLICATION_TARGET" ]; then
      {
        echo ""
        echo "# Replica Configuration"
        echo "$REPLICATION_TARGET"
      } >>"$VALKEY_CONFIG_TMP"
    fi

    {{- if .Values.sentinel.enabled }}
    # In Sentinel mode the replica-side settings are written on every pod,
    # because any pod can be demoted to a replica by a failover.
    CONFIGURE_REPLICA_SETTINGS=true
    {{- else }}
    CONFIGURE_REPLICA_SETTINGS=false
    if [ -n "$REPLICATION_TARGET" ]; then
      CONFIGURE_REPLICA_SETTINGS=true
    fi
    {{- end }}

    if [ "$CONFIGURE_REPLICA_SETTINGS" = "true" ]; then
      log "Configuring replica settings"
      {{- if .Values.replica.disklessSync }}
      {
        echo ""
        echo "# Diskless replication"
        echo "repl-diskless-sync yes"
        echo "repl-diskless-sync-delay 5"
      } >>"$VALKEY_CONFIG_TMP"
      {{- end }}

      {{- if .Values.auth.enabled }}
      # Get the password for the replication user
      {{- $replUsername := .Values.replica.replicationUser }}
      {{- $replUser := index .Values.auth.aclUsers $replUsername }}
      {{- $replPasswordKey := $replUser.passwordKey | default $replUsername }}
      REPL_PASSWORD=$(get_user_password "{{ $replUsername }}" "{{ $replPasswordKey }}") || exit 1
      REPL_PASSWORD_ESCAPED=$(escape_config_arg "$REPL_PASSWORD")

      # Write masterauth configuration
      {
        echo ""
        echo "# Master authentication"
        printf '%s\n' "masterauth \"$REPL_PASSWORD_ESCAPED\""
        echo "masteruser {{ $replUsername }}"
      } >>"$VALKEY_CONFIG_TMP"
      log "Configured masterauth with user {{ $replUsername }}"
      {{- end }}

      {{- if .Values.tls.enabled }}
      # TLS for replication
      {
        echo ""
        echo "# TLS for replication"
        echo "tls-replication yes"
      } >>"$VALKEY_CONFIG_TMP"
      log "Enabled TLS for replication"
      {{- end }}
    fi

    {{- if gt (int .Values.replica.minReplicasToWrite) 0 }}
    # Write safety - require minimum healthy replicas
    {
      echo ""
      echo "# Minimum replicas for write operations"
      echo "min-replicas-to-write {{ .Values.replica.minReplicasToWrite }}"
      echo "min-replicas-max-lag {{ .Values.replica.minReplicasMaxLag }}"
    } >>"$VALKEY_CONFIG_TMP"
    log "Configured write safety: require {{ .Values.replica.minReplicasToWrite }} replicas with max {{ .Values.replica.minReplicasMaxLag }}s lag"
    {{- end }}
    {{- end }}

    # Append extra configs if present
    if [ -f /usr/local/etc/valkey/valkey.conf ]; then
      log "Appending /usr/local/etc/valkey/valkey.conf"
      cat /usr/local/etc/valkey/valkey.conf >>"$VALKEY_CONFIG_TMP"
    fi

    # Publish the finished config atomically.
    mv "$VALKEY_CONFIG_TMP" "$VALKEY_CONFIG"
