{{- $p := .Values.persistence }}
{{- /* Same precedence as 0.x: existingClaim, then this claim, then hostPath */}}
{{- if and $p.enabled (not .Values.replica.enabled) $p.size (not $p.existingClaim) }}
{{- include "valkey.validatePersistence" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  {{- /* The claim name must stay <fullname>, existing releases mount it by name */}}
  name: {{ include "valkey.fullname" . }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
    {{- with $p.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or $p.keepOnUninstall $p.annotations }}
  annotations:
    {{- if $p.keepOnUninstall }}
    "helm.sh/resource-policy": keep
    {{- end }}
    {{- with $p.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    {{- toYaml $p.accessModes | nindent 4 }}
  volumeMode: Filesystem
  resources:
    requests:
      storage: {{ $p.size }}
  {{- if $p.storageClass }}
  storageClassName: {{ $p.storageClass }}
  {{- end }}
{{- end }}
