{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $sentinel := and .Values.replica.enabled .Values.sentinel.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "valkey.fullname" . }}
  labels:
    {{- /* The chart's labels, as on every other resource, with
           networkPolicy.labels on top */}}
    {{- mustMergeOverwrite (include "valkey.labels" . | fromYaml) ($np.labels | default dict) | toYaml | nindent 4 }}
  {{- with $np.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "valkey.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
      {{- if not $np.allowExternal }}
      from:
        # Pods labelled as clients of this release
        - podSelector:
            matchLabels:
              {{ include "valkey.networkPolicy.clientLabel" . }}: "true"
        # The other Valkey pods, for replication
        - podSelector:
            matchLabels:
              {{- include "valkey.selectorLabels" . | nindent 14 }}
        {{- if $sentinel }}
        # Sentinel monitors and reconfigures the nodes
        - podSelector:
            matchLabels:
              {{- include "valkey.sentinel.selectorLabels" . | nindent 14 }}
        {{- if .Values.haproxy.enabled }}
        # HAProxy health checks the nodes and forwards its clients
        - podSelector:
            matchLabels:
              {{- include "valkey.haproxy.selectorLabels" . | nindent 14 }}
        {{- end }}
        {{- end }}
        {{- with $np.ingressNSMatchLabels }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- with $np.ingressNSPodMatchLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- if .Values.metrics.enabled }}
    - ports:
        - port: {{ .Values.metrics.exporter.port }}
    {{- end }}
    {{- with $np.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- if $np.allowExternalEgress }}
    - {}
    {{- else }}
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The other Valkey pods, for replication
    - ports:
        - port: {{ .Values.service.port }}
      to:
        - podSelector:
            matchLabels:
              {{- include "valkey.selectorLabels" . | nindent 14 }}
    {{- if $sentinel }}
    # The init container and the preStop hook ask Sentinel for the master
    - ports:
        - port: {{ .Values.sentinel.port }}
      to:
        - podSelector:
            matchLabels:
              {{- include "valkey.sentinel.selectorLabels" . | nindent 14 }}
    {{- end }}
    {{- end }}
    {{- with $np.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
