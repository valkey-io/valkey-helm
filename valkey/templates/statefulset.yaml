{{- if .Values.replica.enabled }}
{{- include "valkey.validateAuthConfig" . }}
{{- include "valkey.validatePersistence" . }}
{{- include "valkey.validateReplicaAuth" . }}
{{- include "valkey.validateSentinelConfig" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "valkey.fullname" . }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
  {{- with .Values.workloadAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "valkey.headlessServiceName" . }}
  replicas: {{ add (int .Values.replica.replicas) 1 }}
  podManagementPolicy: OrderedReady
  {{- if .Values.replica.persistentVolumeClaimRetentionPolicy }}
  persistentVolumeClaimRetentionPolicy:
    {{- toYaml .Values.replica.persistentVolumeClaimRetentionPolicy | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "valkey.selectorLabels" . | nindent 6 }}
  {{- /* Kubernetes rejects any change to volumeClaimTemplates, and the claim
         name is part of every PVC name (valkey-data-<statefulset>-<index>):
         with default values this must render exactly as in 0.x. */}}
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: valkey-data
      {{- with .Values.persistence.labels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.persistence.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      accessModes: {{ toYaml .Values.persistence.accessModes | nindent 8 }}
      {{- if .Values.persistence.storageClass }}
      storageClassName: {{ .Values.persistence.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.size | quote }}
  template:
    {{- include "valkey.podTemplate" . | nindent 4 }}
{{- end }}
