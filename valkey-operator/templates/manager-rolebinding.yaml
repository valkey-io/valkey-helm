{{- if and .Values.rbac.create .Values.rbac.namespaced }}
{{- range .Values.manager.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "valkey-operator.fullname" $ }}-manager
  namespace: {{ tpl . $ | quote }}
  labels:
    {{- include "valkey-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "valkey-operator.fullname" $ }}-manager
subjects:
- kind: ServiceAccount
  name: {{ include "valkey-operator.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
