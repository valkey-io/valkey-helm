suite: operator namespace-scoped manager RBAC
templates:
  - templates/manager-role.yaml
  - templates/manager-rolebinding.yaml
  - templates/clusterrole.yaml
  - templates/clusterrolebinding.yaml
  - templates/leader-election-role.yaml
  - templates/leader-election-rolebinding.yaml
release:
  namespace: operator-system
tests:
  - it: should render a manager Role in each watched namespace with the manager rules
    template: templates/manager-role.yaml
    set:
      rbac.namespaced: true
      manager.watchNamespaces:
        - team-a
        - team-c
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: RELEASE-NAME-valkey-operator-manager
      - equal:
          path: metadata.namespace
          value: team-a
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: team-c
        documentIndex: 1
      - equal:
          path: rules[1].resources
          value:
            - pods
      - equal:
          path: rules[1].verbs
          value:
            - delete
            - get
            - list
            - watch
      - contains:
          path: rules
          content:
            apiGroups:
              - valkey.io
            resources:
              - valkeyclusters/status
              - valkeynodes/status
            verbs:
              - get
              - patch
              - update

  - it: should bind each manager Role to the operator ServiceAccount in the release namespace
    template: templates/manager-rolebinding.yaml
    set:
      rbac.namespaced: true
      manager.watchNamespaces:
        - team-a
        - team-c
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.name
          value: RELEASE-NAME-valkey-operator-manager
      - equal:
          path: metadata.namespace
          value: team-a
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: team-c
        documentIndex: 1
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: RELEASE-NAME-valkey-operator-manager
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: RELEASE-NAME-valkey-operator
              namespace: operator-system

  - it: should bind the manager Role to a custom ServiceAccount name
    template: templates/manager-rolebinding.yaml
    set:
      rbac.namespaced: true
      serviceAccount.name: custom-operator
      manager.watchNamespaces:
        - team-a
    asserts:
      - equal:
          path: subjects[0].name
          value: custom-operator

  - it: should keep the cluster-wide manager ClusterRole by default, even with watchNamespaces set
    template: templates/clusterrole.yaml
    set:
      manager.watchNamespaces:
        - team-a
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterRole

  - it: should keep the cluster-wide manager ClusterRoleBinding by default, even with watchNamespaces set
    template: templates/clusterrolebinding.yaml
    set:
      manager.watchNamespaces:
        - team-a
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: subjects[0].namespace
          value: operator-system

  - it: should not render manager Roles by default
    template: templates/manager-role.yaml
    set:
      manager.watchNamespaces:
        - team-a
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render manager RoleBindings by default
    template: templates/manager-rolebinding.yaml
    set:
      manager.watchNamespaces:
        - team-a
    asserts:
      - hasDocuments:
          count: 0

  - it: should omit the manager ClusterRole in namespaced mode
    template: templates/clusterrole.yaml
    set:
      rbac.namespaced: true
      manager.watchNamespaces:
        - team-a
    asserts:
      - hasDocuments:
          count: 0

  - it: should omit the manager ClusterRoleBinding in namespaced mode
    template: templates/clusterrolebinding.yaml
    set:
      rbac.namespaced: true
      manager.watchNamespaces:
        - team-a
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail in namespaced mode when manager.watchNamespaces is empty
    template: templates/manager-role.yaml
    set:
      rbac.namespaced: true
      manager.watchNamespaces: []
    asserts:
      - failedTemplate:
          errorMessage: rbac.namespaced requires at least one namespace in manager.watchNamespaces

  - it: should render templated watchNamespaces values in the manager Roles
    template: templates/manager-role.yaml
    set:
      foo: bar
      rbac.namespaced: true
      manager.watchNamespaces:
        - "namespace-{{ .Values.foo }}"
        - static-ns
    asserts:
      - equal:
          path: metadata.namespace
          value: namespace-bar
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: static-ns
        documentIndex: 1

  - it: should render templated watchNamespaces values in the manager RoleBindings
    template: templates/manager-rolebinding.yaml
    set:
      foo: bar
      rbac.namespaced: true
      manager.watchNamespaces:
        - "namespace-{{ .Values.foo }}"
        - static-ns
    asserts:
      - equal:
          path: metadata.namespace
          value: namespace-bar
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: static-ns
        documentIndex: 1

  - it: should render scalar-looking watch namespaces as strings in the manager Roles
    template: templates/manager-role.yaml
    set:
      rbac.namespaced: true
      manager.watchNamespaces:
        - "123"
        - "true"
    asserts:
      - equal:
          path: metadata.namespace
          value: "123"
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: "true"
        documentIndex: 1

  - it: should render scalar-looking watch namespaces as strings in the manager RoleBindings
    template: templates/manager-rolebinding.yaml
    set:
      rbac.namespaced: true
      manager.watchNamespaces:
        - "123"
        - "true"
    asserts:
      - equal:
          path: metadata.namespace
          value: "123"
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: "true"
        documentIndex: 1

  - it: should fail in namespaced mode when a watchNamespaces entry is empty
    template: templates/manager-role.yaml
    set:
      rbac.namespaced: true
      manager.watchNamespaces:
        - team-a
        - ""
    asserts:
      - failedTemplate:
          errorMessage: rbac.namespaced requires every entry in manager.watchNamespaces to name a namespace

  - it: should fail in namespaced mode when a templated watchNamespaces entry renders empty
    template: templates/manager-role.yaml
    set:
      rbac.namespaced: true
      manager.watchNamespaces:
        - "{{ .Values.missing }}"
    asserts:
      - failedTemplate:
          errorMessage: rbac.namespaced requires every entry in manager.watchNamespaces to name a namespace

  - it: should not render manager Roles when rbac.create is false
    template: templates/manager-role.yaml
    set:
      rbac.create: false
      rbac.namespaced: true
      manager.watchNamespaces:
        - team-a
    asserts:
      - hasDocuments:
          count: 0

  - it: should not render manager RoleBindings when rbac.create is false
    template: templates/manager-rolebinding.yaml
    set:
      rbac.create: false
      rbac.namespaced: true
      manager.watchNamespaces:
        - team-a
    asserts:
      - hasDocuments:
          count: 0

  - it: should keep the leader-election Role in the release namespace in namespaced mode
    template: templates/leader-election-role.yaml
    set:
      rbac.namespaced: true
      manager.watchNamespaces:
        - team-a
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.namespace
          value: operator-system

  - it: should keep the leader-election RoleBinding in the release namespace in namespaced mode
    template: templates/leader-election-rolebinding.yaml
    set:
      rbac.namespaced: true
      manager.watchNamespaces:
        - team-a
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.namespace
          value: operator-system
      - equal:
          path: subjects[0].namespace
          value: operator-system
