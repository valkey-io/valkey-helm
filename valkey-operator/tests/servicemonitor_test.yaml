suite: operator servicemonitor configuration
templates:
  - templates/servicemonitor.yaml
tests:
  - it: should not create ServiceMonitor by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create ServiceMonitor when metrics are disabled
    set:
      metrics.enabled: false
      metrics.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: should create ServiceMonitor when enabled
    set:
      metrics.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - isAPIVersion:
          of: monitoring.coreos.com/v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-valkey-operator-metrics
      - equal:
          path: spec.endpoints[0].port
          value: http

  - it: should default the namespace to the release namespace
    set:
      metrics.serviceMonitor.enabled: true
    release:
      namespace: monitoring
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: spec.namespaceSelector.matchNames[0]
          value: monitoring

  - it: should honor an explicit ServiceMonitor namespace
    set:
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.namespace: prometheus
    asserts:
      - equal:
          path: metadata.namespace
          value: prometheus

  - it: should include standard chart labels
    set:
      metrics.serviceMonitor.enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: valkey-operator
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - isNotNull:
          path: metadata.labels["helm.sh/chart"]

  - it: should merge additional ServiceMonitor labels
    set:
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.labels:
        release: kube-prometheus-stack
    asserts:
      - equal:
          path: metadata.labels["release"]
          value: kube-prometheus-stack

  - it: should set interval and scrapeTimeout when provided
    set:
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.interval: 30s
      metrics.serviceMonitor.scrapeTimeout: 10s
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: 30s
      - equal:
          path: spec.endpoints[0].scrapeTimeout
          value: 10s

  - it: should omit interval and scrapeTimeout when empty
    set:
      metrics.serviceMonitor.enabled: true
    asserts:
      - isNull:
          path: spec.endpoints[0].interval
      - isNull:
          path: spec.endpoints[0].scrapeTimeout

  - it: should select the operator metrics service
    set:
      metrics.serviceMonitor.enabled: true
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: valkey-operator
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: RELEASE-NAME

  - it: should use https port and scheme when metrics.secure is true
    set:
      metrics.secure: true
      metrics.serviceMonitor.enabled: true
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: https
      - equal:
          path: spec.endpoints[0].scheme
          value: https
      - equal:
          path: spec.endpoints[0].bearerTokenFile
          value: /var/run/secrets/kubernetes.io/serviceaccount/token
      - isNull:
          path: spec.endpoints[0].tlsConfig

  - it: should honor an explicit scheme over the secure default
    set:
      metrics.secure: true
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.scheme: http
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: https
      - equal:
          path: spec.endpoints[0].scheme
          value: http

  - it: should inject insecureSkipVerify when secure and opt-in without tlsConfig
    set:
      metrics.secure: true
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.insecureSkipVerify: true
    asserts:
      - equal:
          path: spec.endpoints[0].tlsConfig.insecureSkipVerify
          value: true

  - it: should prefer explicit tlsConfig over insecureSkipVerify
    set:
      metrics.secure: true
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.insecureSkipVerify: true
      metrics.serviceMonitor.tlsConfig:
        caFile: /etc/ssl/certs/ca.crt
        insecureSkipVerify: false
    asserts:
      - equal:
          path: spec.endpoints[0].tlsConfig.caFile
          value: /etc/ssl/certs/ca.crt
      - equal:
          path: spec.endpoints[0].tlsConfig.insecureSkipVerify
          value: false

  - it: should prefer authorization over bearerTokenFile when secure
    set:
      metrics.secure: true
      metrics.serviceMonitor.enabled: true
      metrics.serviceMonitor.authorization:
        type: Bearer
        credentials:
          name: scrape-token
          key: token
    asserts:
      - equal:
          path: spec.endpoints[0].authorization.type
          value: Bearer
      - equal:
          path: spec.endpoints[0].authorization.credentials.name
          value: scrape-token
      - isNull:
          path: spec.endpoints[0].bearerTokenFile

  - it: should omit bearer auth when metrics are not secure
    set:
      metrics.secure: false
      metrics.serviceMonitor.enabled: true
    asserts:
      - equal:
          path: spec.endpoints[0].port
          value: http
      - isNull:
          path: spec.endpoints[0].scheme
      - isNull:
          path: spec.endpoints[0].bearerTokenFile
